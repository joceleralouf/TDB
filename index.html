 {cat:"Histoire du bar", q:"Le tonic doit son amertume :", o:["À la quinine, extraite du quinquina","Au houblon","À la gentiane","À l'écorce d'orange amère"], r:0, e:"Utilisée contre le paludisme par les officiers britanniques aux Indes, adoucie au sucre, au citron et au gin : le gin tonic naît d'une prophylaxie. Le quinquina, « arbre à fièvre », a donné son nom à Fever-Tree."},
 {cat:"Histoire du bar", q:"Le Pisco Sour a été créé :", o:["Au Morris' Bar de Lima, vers 1920","À Santiago du Chili","À Ica","À Arequipa"], r:0, e:"Par l'Américain Victor Vaughen Morris. Le Pérou et le Chili se disputent l'appellation pisco ; le Pérou impose une distillation unique au degré, sans eau ni bois — la règle des Cuatro Gallos."},
 {cat:"Histoire du bar", q:"Le Mai Tai et le Zombie appartiennent :", o:["Au répertoire tiki","Aux cocktails de la Prohibition","Aux classiques du Savoy","Aux drinks de la Belle Époque"], r:0, e:"Le Zombie est de Donn Beach (1934), le Mai Tai de Trader Vic (1944). Les deux maisons se sont longtemps disputé la paternité du style polynésien."},
 {cat:"Histoire du bar", q:"Le Corpse Reviver n°2 associe gin, Lillet, Cointreau, citron et :", o:["Un rinçage d'absinthe","Un trait de Fernet","Du marasquin","Un blanc d'œuf"], r:0, e:"Publié par Craddock dans le Savoy Cocktail Book (1930), avec sa note fameuse : quatre pris coup sur coup raniment le cadavre — et le retuent. La famille des « Corpse Reviver » est celle des remontants du matin."},
 {cat:"Histoire du bar", q:"La première édition du Savoy Cocktail Book contient environ :", o:["300 recettes","500 recettes","750 recettes","1 200 recettes"], r:1, e:"Environ 750 selon les décomptes, souvent arrondi à 500 pour les recettes proprement dites. C'est le livre le plus réédité du métier ; la mise en page art déco est de Gilbert Rumbold."},

 {q:"L'Un-Oaked de Dartigalongue est embouteillé à 40°.", r:false, e:"FAUX : 43,2°, après réduction lente depuis 58° en cuve inox."},
 {q:"Le concentré de Campari est fabriqué dans une seule salle à Milan avant d'être expédié aux usines.", r:true, e:"VRAI : c'est ce qui protège la recette. Le seul ingrédient officiellement confirmé est l'écorce d'orange amère."},
 {q:"Les purées Ponthier peuvent contenir des arômes ajoutés pour homogénéiser le goût.", r:false, e:"FAUX : aucun additif — ni colorant, ni conservateur, ni arôme. Minimum 90 % de fruit."},


 /* ===== LIVRE, IMPOSÉS ET FINALE ===== */
 {q:"Robert Vermeire était surnommé « Robert's ».", r:true, e:"VRAI : c'est le surnom qui figure sur la page de titre de « L'Art du Cocktail »."},
 {q:"Le premier livre de Vermeire a été publié à Bruxelles.", r:false, e:"FAUX : « Cocktails : How to Mix Them » a paru à LONDRES en 1922, chez Herbert Jenkins & Co. C'est « L'Art du Cocktail » qui est imprimé à Bruxelles."},
 {q:"Vermeire recommande la glace pilée pour remuer au verre à mélange.", r:false, e:"FAUX : glace en MORCEAUX de préférence, car la pilée fond trop vite."},
 {q:"Selon Vermeire, l'Old Fashioned est préparé et bu dans le même verre.", r:true, e:"VRAI : c'est même le sens de son nom, « vieille mode », hérité de l'époque sans shaker."},
 {q:"Le Dry Martini personnel de Vermeire se fait au vermouth Martini.", r:false, e:"FAUX : au NOILLY PRAT. Il précise d'ailleurs que Martinez, l'inventeur présumé, utilisait lui aussi du Noilly Prat."},
 {q:"Vermeire dit avoir remporté le premier prix du concours du Daily Mail 1937.", r:false, e:"FAUX : il a remporté le 15e et le 17e prix, mais il est le SEUL concurrent à en avoir remporté deux."},
 {q:"Le « White Lady » est un Side-Car dans lequel la fine est remplacée par du gin.", r:true, e:"VRAI. Le Side-Car lui-même a été introduit à Londres par MacGarry, du Buck's Club."},
 {q:"Le Yellow Daisy est le seul cocktail imposé de la liste à contenir de l'absinthe.", r:true, e:"VRAI : Roku, Noilly Prat dry, Grand Marnier, L'Entêté. C'est aussi le seul avec du Noilly Prat."},
 {q:"Le Raspberry Mule et le Mezcal Mule utilisent tous deux du citron vert.", r:false, e:"FAUX : le Raspberry Mule est au jus de CITRON jaune, le Mezcal Mule au citron VERT."},
 {q:"Le Harvard de la liste officielle se fait à base de cognac Merlet.", r:true, e:"VRAI : Merlet + Carpano + aromatic bitters. Le seul imposé à base de cognac, et il figure aussi chez Vermeire."},
 {q:"À la dégustation à l'aveugle, une mauvaise réponse fait perdre un point.", r:false, e:"FAUX : mauvaise réponse ET absence de réponse ne changent rien. Bonne réponse : +1. Il faut donc toujours tenter."},
 {q:"Le QCM et la dégustation se déroulent l'un après l'autre.", r:false, e:"FAUX : EN MÊME TEMPS, avec 30 minutes au total pour les deux."},
 {q:"L'épreuve de mixologie est celle qui pèse le plus lourd.", r:true, e:"VRAI : coefficient 5, contre 3 pour la dégustation et le rétro-assemblage, et 2 pour le QCM."},
 {q:"On peut retirer de sa recette création un ingrédient d'un fournisseur officiel.", r:false, e:"FAUX : on peut ajouter un ingrédient, ou en retirer un — SAUF s'il vient d'un fournisseur officiel."},
 {q:"Le rétro-assemblage se déroule individuellement.", r:false, e:"FAUX : par équipe de 3, tirées au sort en début de journée. 30 minutes, 5 échantillons."},
 {q:"Le verre Coupe imposé est le plus haut des trois.", r:true, e:"VRAI : 174 mm, contre 146 mm pour le highball et 77 mm pour le rocks. Mais c'est le plus petit en contenance : 220 ml."},

 {q:"Le cocktail Dempsey a été créé au Kursaal d'Ostende en 1912.", r:false, e:"FAUX : Dempsey est une recette de « Guido » datée de Deauville-Monte Carlo, 1921. C'est le VANDERBILT qui date du Kursaal d'Ostende, 1912."},
 {q:"Chez Vermeire, l'Apple Jack Brandy correspond au calvados en France.", r:true, e:"VRAI, et il est aussi appelé « Jersey Lightning »."},
 {q:"Le Star est un Klondyke avec deux traits de curaçao orange.", r:true, e:"VRAI. Le Klondyke : orange bitter, vermouth français, apple jack."},
 {q:"Vermeire recommande de remplir le verre à cocktail jusqu'au bord.", r:false, e:"FAUX : à un demi-centimètre du bord. Il insiste : jamais jusqu'au bord, par propreté et pour la facilité du service."},
 {q:"Le Gloom Raiser contient du vermouth Noilly Prat.", r:true, e:"VRAI : 2 traits de grenadine, 2 traits d'absinthe, 2/3 dry gin, 1/3 Noilly Prat. Créé par Vermeire au R.A.C. en 1915."},
 {q:"Le Whip est connu en Égypte sous le nom de Kurbag.", r:true, e:"VRAI : quatre quarts — absinthe Pernod, vermouth français, curaçao, fine."},
 {q:"Le Millionnaire est né au Savoy Hotel.", r:false, e:"FAUX : au RITZ Hotel. C'est le Queen's qui vient du Savoy, par Harry Craddock."},
 {q:"Dans le Za-Za d'avant-guerre, on employait du pepson bitter.", r:true, e:"VRAI : 2 traits de pepson bitter, 1/3 dry gin, 2/3 vermouth italien."},
 {q:"Le Turf se sert avec une pelure de citron pressée dessus.", r:false, e:"FAUX : Vermeire précise de ne presser NI pelure de citron NI pelure d'orange. Juste une olive."},
 {q:"Le Glad Eye contient deux tiers d'absinthe.", r:true, e:"VRAI : 1/3 pipermenthe Get, 2/3 absinthe. C'est le plus chargé en absinthe de l'extrait."},

 {q:"Le Mai Tai a été créé à Hawaï.", r:false, e:"FAUX : à Oakland, en Californie, par Trader Vic en 1944. L'association avec Hawaï est une idée reçue."},
 {q:"Le New York Sour est né à Chicago.", r:true, e:"VRAI, dans les années 1880, sous le nom de « claret snap » notamment."},
 {q:"Le Yellow Daisy appartient à la famille des Daisy.", r:false, e:"FAUX : malgré son nom, c'est un Martini sucré et aromatisé. Savoy Cocktail Book, 1930."},
 {q:"Le Frisco contenait à l'origine du jus de citron.", r:false, e:"FAUX : whisky et Bénédictine seulement, remués. Le citron arrive plus tard et en fait un sour."},
 {q:"Le Tampico est une création française.", r:true, e:"VRAI : années 1960, attribué à Rudolf Slavik, barman de l'hôtel George V à Paris."},
 {q:"Le Harvard est apparu pour la première fois chez Robert Vermeire.", r:false, e:"FAUX : chez George J. Kappeler, « Modern American Drinks », 1895. Vermeire le reprend plus tard, sans le seltz de la version d'origine."},
 {q:"Le Jasmine a été nommé d'après la fleur.", r:false, e:"FAUX : d'après Matt Jasmin, l'ami de Paul Harrington — dont le nom fut longtemps mal orthographié avec un « e »."},
 {q:"Le Boulevardier figure dans la liste principale des recettes de Barflies and Cocktails.", r:false, e:"FAUX : il apparaît dans la section « Cocktails Round Town » d'Arthur Moss, pas dans la liste principale de McElhone."},

 {q:"Le premier livre de cocktails a été publié par Jerry Thomas en 1862.", r:true, e:"VRAI : « How to Mix Drinks, or The Bon-Vivant's Companion », aux États-Unis."},
 {q:"« London gin » signifie que le gin est produit à Londres.", r:false, e:"FAUX : c'est une catégorie réglementaire, pas une origine géographique — aromatisation par redistillation seule, sans colorant ni quasi sucre."},
 {q:"Dans l'UE, un whisky doit vieillir au minimum trois ans.", r:true, e:"VRAI, en fûts de 700 litres maximum, et titrer au moins 40 % vol."},
 {q:"L'orgeat est un sirop à base d'orge.", r:false, e:"FAUX : c'est un sirop d'AMANDE, souvent parfumé à la fleur d'oranger, malgré ce que son nom laisse croire."},
 {q:"Le vermouth est classé comme un spiritueux.", r:false, e:"FAUX : c'est un VIN AROMATISÉ — au moins 75 % de vin, 14,5 à 22 % vol, armoise obligatoire."},
 {q:"L'Association des Barmen de France est membre fondateur de l'IBA.", r:true, e:"VRAI : l'un des sept fondateurs en 1951 à Torquay."},
 {q:"L'IBA exprime ses recettes officielles en millilitres.", r:false, e:"FAUX : en CENTILITRES."},
 {q:"Un cognac XO doit aujourd'hui avoir au moins six ans.", r:false, e:"FAUX : dix ans depuis 2018. C'était six ans auparavant."},
 {q:"Le Sazerac était à l'origine fait au rye whiskey.", r:false, e:"FAUX : au cognac. Le passage au rye vient de la raréfaction du cognac après le phylloxéra."},
 {q:"On remue un Negroni et on frappe un Daiquiri.", r:true, e:"VRAI : on remue quand tout est limpide et alcoolisé, on frappe dès qu'il y a jus, purée, sirop épais ou œuf."},
 {q:"La dilution est un défaut qu'il faut chercher à éliminer.", r:false, e:"FAUX : elle fait partie intégrante de la recette. Un cocktail bien frappé gagne environ 20 à 25 % de volume en eau."},
 {q:"La passoire julep se pose sur le shaker.", r:false, e:"FAUX : sur le VERRE À MÉLANGE. C'est la hawthorne, à ressort, qui va sur le shaker."},
 {q:"Une crème de cassis doit contenir au moins 400 g de sucre par litre.", r:true, e:"VRAI, contre 250 g/L pour les autres « crème de » et 100 g/L pour une liqueur simple."},
 {q:"Le tiki a été inventé par Trader Vic.", r:false, e:"FAUX : Donn Beach ouvre Don the Beachcomber à Hollywood au début des années 1930, avant Trader Vic. Les deux maisons se disputeront la paternité du style."},
 {q:"Le Bramble et l'Espresso Martini sont tous deux attribués à Dick Bradsell.", r:true, e:"VRAI : le barman londonien de la renaissance du cocktail des années 1980."},

    <li><b>Benleioc</b> — Ben+Lei+Oc. Brassins type stout (1re en Europe), affinage Pacherenc. Sorgho / Tourbé 45°.</li>

    <li><b>Sab's</b> — Pigneret (1941) rachetée en 2018, Beaune, bouilleur ambulant ; marque Sab's fin 2019. Marc = peaux/pépins. Le Blanc 43° / Le Marc 46° (finish cognac).</li>

   <div class="fiche-block"><h4>Liqueurs & spécialités</h4><ul>

    <li><b>Grand Marnier</b> — 1880, 51 % cognac + bigarade, baptisée par César Ritz.</li>
    <li><b>Kota</b> — « kota » = la <b>ville</b> (indonésien/malais). Pandan « vanille d'Asie », Nico de Soto × Boudier, été 2024, 18°, feuilles de Thaïlande.</li>
    <li><b>Marie Brizard</b> — 1755 Bordeaux, doyenne du concours, fondée par une femme, anisette 25°.</li>
   </ul></div>
  </div>`},

 {t:"Socle : catégories, familles, méthodes", html:`
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Catégories (= contenance)</h4><ul>
    <li><b>Short drink</b> — plutôt puissant, ≤ 100 ml (moins de 10 cl).</li>
    <li><b>Long drink</b> — plutôt allongé, à partir de 100 ml (10 cl).</li>
   </ul>
   <h4>Types (= temps)</h4><ul>
    <li><b>Before dinner</b> — apéritif, plus ou moins amer/sec.</li>
    <li><b>After dinner</b> — digestif, plus ou moins liquoreux/puissant.</li>
    <li><b>All day cocktail</b> — tout moment, fruité, désaltérant.</li>
   </ul></div>
   <div class="fiche-block"><h4>Familles du socle</h4><ul>
    <li><b>Colada</b> — eau-de-vie + crème de coco + jus (Piña Colada).</li>
    <li><b>Fizz</b> — eau-de-vie + sucre + citron + eau gazeuse (Gin Fizz).</li>
    <li><b>Julep</b> — eau-de-vie vieillie + sucre + menthe (Mint Julep).</li>
    <li><b>Old-Fashioned</b> — eau-de-vie vieillie + sucre + bitters.</li>
    <li><b>Smash</b> — eau-de-vie + herbe + sucre + agrume (Gin Basil Smash).</li>
    <li><b>Sour</b> — spiritueux + sucre + agrume (+ souvent blanc d'œuf).</li>
    <li><b>Tiki</b> — rhum(s) + sucre + agrume + jus de fruits (Mai Tai).</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 3 méthodes</h4><ul>
    <li><b>Shaker</b> — mélanger, émulsionner, rafraîchir en limitant la fonte (jus, crème, œuf).</li>
    <li><b>Verre à mélange</b> — mélanger + rafraîchir avec dilution (produits alcooliques ; pas de jus/soda).</li>
    <li><b>Direct au verre</b> — quand les ingrédients se mélangent facilement.</li>
   </ul></div>
   <div class="fiche-block"><h4>Règle des « 3 S » (créations)</h4><ul>
    <li><b>Sweet</b> — le sucré : liqueur, crème, fruit, sirop, sucre.</li>
    <li><b>Sour</b> — l'acidité, le lien : agrume, verjus, solution acide.</li>
    <li><b>Strong</b> — la puissance, le corps : l'eau-de-vie / le spiritueux.</li>
    <li>Max 6 ingrédients · verser du moins cher au plus cher · doses en ml.</li>
   </ul></div>
  </div>`},
 {t:"Socle : calcul du TAV", html:`
  <p class="fiche-lead">La méthode officielle, illustrée sur l'Americano.</p>
  <div class="tav-demo">
   <div class="tav-line"><span>20 ml vermouth rouge à 14,5 %</span><b>20 × 14,5 = 290</b></div>
   <div class="tav-line"><span>50 ml bitter à 25 %</span><b>50 × 25 = 1250</b></div>
   <div class="tav-line"><span>50 ml eau gazeuse à 0 %</span><b>50 × 0 = 0</b></div>
   <div class="tav-tot"><span>Contenance = 120 ml</span><b>Total = 1540</b></div>
   <div class="tav-res">1540 ÷ 120 = 12,83 → <b>TAV de 13 %</b></div>
  </div>
  <p class="fiche-note">Formule : (Σ des volumes × degrés) ÷ contenance totale = TAV du cocktail.</p>`},
 {t:"Lexique pro (extraits socle)", html:`
  <p class="fiche-lead">Les termes du référentiel qui peuvent tomber.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><ul>
    <li><b>Albédo</b> — partie blanche de l'écorce d'un agrume (le « ziste »).</li>
    <li><b>Aquafaba</b> — jus de pois chiche, émulsifiant.</li>
    <li><b>Cuban roll</b> — transvaser d'une timbale à l'autre pour oxygéner (ex-« throwing »).</li>
    <li><b>Collins</b> — long drink, même composition qu'un Fizz mais direct au verre.</li>
    <li><b>Dry shake</b> — frapper une 1re fois sans glace, avec émulsifiant.</li>
    <li><b>Reverse dry shake</b> — frapper une 2de fois sans glace, avec émulsifiant.</li>
    <li><b>Exprimer</b> — libérer les essences d'un zeste.</li>
    <li><b>Float</b> — verser un filet de liquide sur le cocktail sans mélanger.</li>
   </ul></div>
   <div class="fiche-block"><ul>
    <li><b>Givrer (rim)</b> — décorer les parois d'un verre (ex. Margarita).</li>
    <li><b>Macération</b> — extraction d'arômes à froid ; <b>infusion</b> — à chaud.</li>
    <li><b>Muter</b> — stopper la fermentation par ajout d'alcool (garde les sucres).</li>
    <li><b>Mesure</b> — 40 ml (standard français).</li>
    <li><b>Trait (dash)</b> — environ 3 à 5 gouttes.</li>
    <li><b>Shaker Boston</b> — 2 timbales, axe décalé · <b>Continental</b> — emboîtement parfait · <b>3 pièces</b> — passoire intégrée.</li>
    <li><b>Mocktail / No Low</b> — sans alcool / faible degré (consommation responsable).</li>
    <li><b>Swizzle stick</b> — le « bois lélé » des Antilles.</li>
   </ul></div>
  </div>`},
 {t:"Expert — procédés décortiqués", html:`
  <p class="fiche-lead">Le cran au-dessus : ce qui se passe vraiment dans la cuve, l'alambic ou le fût. C'est là que se gagnent les questions de jury.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Non alcool</h4><ul>
    <li><b>Giffard Sans Alcool</b> — macération dans du <b>vinaigre de vin blanc</b> français (technique du shrub), puis un procédé maison efface les notes de vinaigre. Pasteurisé : ~4 à 5 mois après ouverture, sans réfrigération. Sucre calé sur celui d'une liqueur (100-200 g/L).</li>
    <li><b>Giffard Bases Cocktail</b> — 4 ans de R&D, chaque base est le miroir d'un spiritueux : Aperitif Bitter, Woody Malt (whisky), Smoky Agave (mezcal), Herbal + Juniper (gin), Cold Cane (rhum), Ruby Grape (vermouth).</li>
    <li><b>Fever-Tree</b> — 15 à 18 mois de mise au point : British Library (sources sur la quinine remontant à 1620), sourcing de l'écorce à la frontière Rwanda / RD Congo, 5 versions de recette. Zéro saccharine, zéro benzoate de sodium, zéro décanal.</li>
    <li><b>Ponthier</b> — min. 90 % de fruit, max. 10 % de sucre de canne, aucun additif. Une seule origine + une seule variété par parfum (label Pure Trace). Contrôle pesticides par un labo indépendant allemand.</li>
    <li><b>PCB / Ingredium</b> — 5 familles : Texturants &amp; Amidons · Acides &amp; Sels · Émulsifiants &amp; Stabilisants · Sucres &amp; Dérivés · Clean Label. Formulée avec des chefs (Hermé, Grolet, Michalak, Brys…).</li>
   </ul></div>
   <div class="fiche-block"><h4>Apéritifs &amp; amers</h4><ul>
    <li><b>Combier</b> — triple sec : oranges d'Haïti macérées ~48 h, triple distillation, alambics de cuivre centenaires. Absinthes distillées dans deux alambics <b>Pernod Fils</b> d'époque (ceux des Jade de Ted Breaux). Royal Combier (1920) = triple sec + Élixir + cognac Delamain.</li>
    <li><b>Campari</b> — 60 à 68 plantes, écorces et fruits ; seul ingrédient confirmé : l'écorce d'orange amère. Le <b>concentré</b> est assemblé dans une salle unique à Milan puis expédié aux usines. Nom d'origine : « Bitter all'uso d'Hollanda ».</li>
    <li><b>La Ina</b> — Fino ≈ 6 ans sous flor (solera 1919) · Rio Viejo ≈ 10 ans en oxydatif (solera <b>1918</b>, nom d'un domaine de Macharnudo) · Viña 25 PX passerillé. 4 000 botas reprises à Domecq en 2008 par Lustau (fondée 1896, Grupo Caballero).</li>
    <li><b>Noilly Prat</b> — 8 mois en foudres → <b>1 an dehors dans l'Enclos</b> en demi-muids (part des anges ≈ 6 %) → assemblage + mistelle + alcoolats de citron et framboise → 21 jours de macération (~20 plantes) avec dodinage 2×/jour → repos ~6 semaines. <b>Seuls l'Original Dry et l'Extra Dry passent par l'Enclos.</b></li>
    <li><b>Carpano</b> — Antica Formula : extraction à chaud ET à froid d'environ <b>130 botaniques</b>, sucre + sucre brûlé. Vanilles de Madagascar, Tahiti, Papouasie ; safran d'Iran ; armoise du Piémont et du Val d'Aoste. Recette connue de 3 personnes.</li>
   </ul></div>
   <div class="fiche-block"><h4>Eaux-de-vie &amp; alcools</h4><ul>
    <li><b>Fiba</b> — <b>raquettes</b> d'Opuntia ficus-indica, coupées, <b>fumées au bois d'olivier</b>, macérées, distillées ; réduction lente sur 1 mois à l'eau de la Montagne Noire. Chez BOWS, les céréales sont émondées puis <b>cuites à la vapeur</b>.</li>
    <li><b>Oli'Still</b> — l'olive n'a <b>pas de sucre fermentescible</b> : on ne peut pas la fermenter. Macération des olives dans l'alcool, puis alambic charentais à repasse et sélection des cœurs. Exactement la logique d'un gin.</li>
    <li><b>Roku</b> — printemps : sakura (fleur + feuille) · été : sencha + gyokuro · automne : sanshō · hiver : yuzu. 4 types d'alambics au Liquor Atelier, chaque famille distillée séparément. + 8 classiques : genièvre, coriandre, angélique (racine et graine), cardamome, cannelle, orange amère, citron.</li>
    <li><b>Wild Turkey</b> — mash bill ~75 / 13 / 12. Entrée en fût volontairement basse (107 puis 115 proof, contre 125 max légal). Char n°4 « alligator » ≈ 55 s de flamme. Eau de la Kentucky River filtrée par le calcaire.</li>
    <li><b>Isautier Fusion</b> — co-fermentation de 36 h mélasse + pur jus (50/50), colonne, 2,5 ans de repos en cuve. IGP « Rhum de La Réunion » depuis le 22 janvier 2015 ; 3 distilleries sur l'île (Isautier, Savanna, Rivière du Mât).</li>
    <li><b>Appleton</b> — 1655 le domaine, <b>1749</b> la première trace de distillation, <b>1944</b> la marque. Source River Head filtrée par le calcaire, pot stills à double retort, ~200 000 fûts sur place, vieillissement 100 % tropical.</li>
    <li><b>Calle 23</b> — agaves de 7 à 9 ans, autoclave <b>basse pression</b>, fermentation inox sans fibres avec des levures sauvages isolées dans les champs, double distillation, sortie à 55 % puis réduction à 40°.</li>
    <li><b>Nuestra Soledad</b> — four conique de terre (mesquite et chêne), tahona, fermentation sauvage en tinas, double distillation en cuivre. Casa Cortés : Agave de Cortés / Nuestra Soledad / El Jolgorio.</li>
    <li><b>Cuatro Gallos</b> — distillation unique <b>au degré</b>, zéro eau, zéro bois, repos min. 3 mois en cuve inerte. Fundo El Carmen, San Juan Bautista, sol argileux, vieilles vignes de Quebranta.</li>
    <li><b>Dartigalongue</b> — colonne armagnacaise à 58° · Un-Oaked : ≥ 3 mois en inox, réduction à <b>43,2°</b> · Single-Oaked : fûts de chêne <b>roux</b> (usagés) à chauffes moyennes et fortes · Double-Oaked : <b>double</b> passage en fûts <b>neufs</b> gascons à chauffe forte. 90 % chêne de Gascogne.</li>
    <li><b>Merlet</b> — Brothers Blend : eaux-de-vie de 4 à 12 ans, majorité Fins Bois + ~1/5 Grande Champagne. 40 ha entre Saint-Sauvant et Chérac. La maison a créé <b>Hpnotiq</b> en 2001.</li>
    <li><b>Sab's</b> — alambic à vapeur <b>Müller</b> ambulant (le type utilisé pour la grappa), coupe des cœurs au nez. Le Blanc : 100 % pinot noir, 1 an en inox. Le Marc : 4 ans en fûts de 228 L + 6 mois de finish en fût de cognac.</li>
   </ul></div>
   <div class="fiche-block"><h4>Liqueurs &amp; spécialités</h4><ul>
    <li><b>Adriatico</b> — amandes Filippo Cea cueillies à la main autour d'<b>Alberobello</b>, séchées au soleil, longuement torréfiées (Classico) ou concassées et infusées à cru (Bianco). Sel de la saline de Margherita di Savoia. 2 ans de mise au point ; fondée en septembre 2019 par Jean-Robert Bellanger et Thomas Benoit.</li>
    <li><b>Algebra</b> — extraction à froid fractionnée au laboratoire londonien, café Has Bean torréfié dans le <b>Staffordshire</b>, rhum des Caraïbes, sucre de canne, embouteillage chez Thames Distillers. <b>100 g/L = minimum légal UE</b> — seules exceptions : cerise (70 g/L) et gentiane (80 g/L).</li>
    <li><b>Chinola</b> — ferme « El Valle de Chinola », péninsule de Samaná ; fruits transformés dans les 24 h, alcool neutre de canne, zéro arôme ni colorant. Première liqueur de fruits frais vine-to-bottle stable à température ambiante.</li>
    <li><b>Kota</b> — feuilles fraîches de pandan de Thaïlande macérées plusieurs jours dans un alcool neutre, puis distillées à Dijon chez Boudier. Idée dès 2020, échantillonnage mars 2024, lancement été 2024. Florent Beuchet (Compagnie des Indes) est l'entremetteur et dirige la marque.</li>
    <li><b>Gabriel Boudier</b> — ~75 personnes, DG Claire Battault, groupe Famille Piffaut. Produit en propre <b>et pour des tiers</b> : Kota, Saffron Gin.</li>
    <li><b>Bénédictine</b> — 27 plantes travaillées en plusieurs fractions distillées séparément, assemblées puis vieillies. D.O.M. = Deo Optimo Maximo.</li>
   </ul></div>
  </div>`},
 {t:"Pièges avancés", html:`
  <p class="fiche-lead">Les confusions les plus probables. Si tu ne dois relire qu'une fiche la veille, c'est celle-là.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Matière première &amp; procédé</h4><ul>
    <li><b>Fiba</b> : les <b>raquettes</b> du cactus, pas le fruit. Fumage au <b>bois d'olivier</b>, pas dans un four enterré.</li>
    <li><b>Oli'Still</b> : l'olive ne se fermente pas (pas de sucre). Macération dans l'alcool puis distillation.</li>
    <li><b>Marc vs Fine</b> : le marc distille les peaux, pépins et rafles ; la fine distille le vin ou les lies.</li>
    <li><b>Pisco</b> : une seule distillation, directement au degré, jamais d'eau après, jamais de bois.</li>
    <li><b>Giffard</b> : vinaigre de vin <b>blanc</b>, pas de cidre.</li>
   </ul></div>
   <div class="fiche-block"><h4>Bois &amp; élevage</h4><ul>
    <li><b>Single-Oaked</b> (Dartigalongue) = fûts de chêne <b>roux</b>, déjà utilisés — pas un fût neuf. Le <b>Double-Oaked</b> = deux passages en fûts <b>neufs</b>.</li>
    <li><b>Noilly Prat</b> : seuls l'<b>Original Dry</b> et l'<b>Extra Dry</b> vieillissent dehors dans l'Enclos.</li>
    <li><b>Calle 23</b> : Reposado = 8 mois, Añejo = 16 mois. Ne pas inverser.</li>
    <li><b>Appleton</b> : l'âge affiché est celui du rhum le <b>plus jeune</b> de l'assemblage.</li>
    <li><b>Sab's Le Marc</b> : 4 ans en fûts bourguignons de 228 L <b>puis</b> 6 mois de finish en fût de cognac.</li>
   </ul></div>
   <div class="fiche-block"><h4>Dates qui se ressemblent</h4><ul>
    <li><b>Appleton</b> : 1655 le domaine · 1749 la distillation · 1944 la marque.</li>
    <li><b>La Ina</b> : solera du fino en <b>1919</b>, solera de Rio Viejo en <b>1918</b>, reprise par Lustau en 2008.</li>
    <li><b>Wild Turkey</b> : site 1869 · marque 1940 (Austin Nichols) · rachat de la distillerie Ripy 1972 · Campari 2009.</li>
    <li><b>Combier</b> : maison 1834 · distillerie construite 1848 · absinthe 1899 · interdiction 1915 · rachat Choisne 2000 · relance 2004 · Blanchette 2006 · mention légale 2011 · L'Entêté 2012.</li>
    <li><b>Sab's</b> : Pigneret fondée 1941 · rachat 2018 · marque Sab's fin 2019.</li>
    <li><b>Manguin</b> : vergers années 40 · alambics 1957 · Hanquiez 2011 · olive distillée 2014.</li>
   </ul></div>
   <div class="fiche-block"><h4>Noms &amp; propriétaires</h4><ul>
    <li><b>Kota</b> = « la ville », pas « pandan ».</li>
    <li><b>Sab's</b> = Société Alambic Bourguignon <b>et</b> Sabbagh.</li>
    <li><b>Antoinette Isautier</b> = l'<b>épouse</b> de Charles, pas sa fille.</li>
    <li><b>Virginie Dartigalongue</b> a été convaincue par sa <b>tante</b> Françoise en 2010.</li>
    <li>Distributeur ≠ propriétaire : Dugas <b>distribue</b> Carpano, mais Carpano <b>appartient</b> à Fratelli Branca.</li>
    <li><b>Boudier</b> produit Kota, <b>Combier</b> produit les Jade, <b>Merlet</b> a créé Hpnotiq, <b>Lustau</b> élève La Ina.</li>
   </ul></div>
  </div>`},
 {t:"Le jour J — format des épreuves", html:`
  <p class="fiche-lead">Bastille Design Center, 74 boulevard Richard Lenoir, Paris 11e — dimanche 13 septembre 2026. Douze finalistes.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Les coefficients (total 13)</h4><ul>
    <li><b>Mixologie — coefficient 5</b> : création + imposé. À elle seule ~38 % de la note.</li>
    <li><b>Dégustation à l'aveugle — coefficient 3</b> : 5 spiritueux + 2 cocktails.</li>
    <li><b>Rétro-assemblage — coefficient 3</b> : par équipe de 3.</li>
    <li><b>QCM — coefficient 2</b> : 50 questions.</li>
    <li class="mini">Priorité de révision : la pratique d'abord, mais dégustation + rétro pèsent ensemble autant que la mixologie.</li>
   </ul></div>
   <div class="fiche-block"><h4>Déroulé de la journée</h4><ul>
    <li>10h30 accueil et installation · 11h00 briefing · 12h30 déjeuner</li>
    <li>13h45 ouverture au public · 14h00 présentation du concours</li>
    <li><b>14h15 → 18h15</b> passage sur les différentes épreuves</li>
    <li>18h30 remise des prix · 19h30 fin</li>
    <li class="mini">Salle de préparation dédiée : table de travail, réfrigérateur, congélateur, point d'eau.</li>
   </ul></div>
   <div class="fiche-block"><h4>QCM — la répartition exacte</h4><ul>
    <li><b>50 questions</b>, une seule bonne réponse par question.</li>
    <li><b>30 %</b> marques partenaires — les questions sortent des <b>sites internet officiels</b> des fournisseurs.</li>
    <li><b>20 %</b> extrait de livre — sur <b>l'ensemble</b> du contenu de l'annexe.</li>
    <li><b>50 %</b> historiques et générales : recettes, spiritueux, historique du bar.</li>
    <li class="mini">QCM et dégustation en <b>même temps</b>, 30 minutes au total.</li>
   </ul></div>
   <div class="fiche-block"><h4>Dégustation — la stratégie</h4><ul>
    <li>5 spiritueux : donner la <b>marque partenaire</b>. 2 cocktails : le <b>nom</b> seulement.</li>
    <li>Bonne réponse <b>+1</b> · mauvaise réponse <b>0</b> · pas de réponse <b>0</b>.</li>
    <li><b>Conséquence : ne jamais laisser une case vide.</b> Une intuition vaut mieux qu'un blanc, le risque est nul.</li>
    <li>Un package de mignonettes est envoyé un mois avant : s'entraîner à l'aveugle, en série, plutôt qu'échantillon par échantillon.</li>
   </ul></div>
   <div class="fiche-block"><h4>Mixologie — les contraintes</h4><ul>
    <li>Création en <b>2 exemplaires</b> (thèmes Local ou Technique) ou <b>4</b> (concept/miroir) + imposé en <b>1</b> = 3 verres jury.</li>
    <li><b>8 minutes</b> de la mise en place à la fin de l'élaboration. Pénalité au-delà, <b>arrêt total à 10 minutes</b>.</li>
    <li>Modifications possibles : ajouter un ingrédient · en retirer un <b>sauf fournisseur officiel</b> · faire évoluer méthode et service. Nom et dosages ajustables.</li>
    <li><b>À communiquer 10 jours avant</b> : modifications ET morceaux de musique.</li>
    <li><b>Pre-batch de 1 litre</b> à préparer sur place pour le public — prévoir les ingrédients maison en quantité.</li>
   </ul></div>
   <div class="fiche-block"><h4>Rétro-assemblage</h4><ul>
    <li><b>Équipe de 3</b>, tirée au sort en début de journée. 30 minutes.</li>
    <li>Retrouver les <b>proportions</b> d'un assemblage finalisé à partir de <b>5 échantillons</b> d'eaux-de-vie.</li>
    <li>À rendre : la <b>composition écrite</b> ET un <b>échantillon</b>.</li>
    <li class="mini">Méthode : identifier d'abord les marqueurs les plus saillants (bois, fumé, floral), puis procéder par ajouts croissants en gardant un témoin. Toujours réserver un fond de chaque eau-de-vie pure pour recaler le nez.</li>
   </ul></div>
  </div>`},
 {t:"Les 13 cocktails imposés", html:`
  <p class="fiche-lead">Tirés au sort <b>juste avant</b> ton passage. Histoires vérifiées sur sources primaires quand elles existent — quelques recettes de la liste sont des déclinaisons modernes sans paternité établie, c'est signalé. Tous les produits sont déjà en place dans la station. Composition officielle de l'annexe #2 — la verrerie et la méthode proposées ici sont des <i>suggestions de travail</i> à valider au briefing.</p>
  <div class="fiche-grid">
   ${IMP_GROUPES.map(g=>'<div class="fiche-block" style="grid-column:1/-1"><h4>'+g+'</h4>'+IMPOSES.filter(c=>c.grp===g).map(c=>'<p style="margin:10px 0 2px"><b style="color:var(--copper-2);font-size:1.05rem">'+c.n+'</b> — <span class="mini">'+c.verre+' · '+c.met+'</span></p><p style="margin:2px 0">'+c.dose.map(d=>d[0]+' <b>'+d[1]+'</b>').join(' · ')+'</p>'+(c.alerte?'<p class="mini" style="color:var(--campari);margin:2px 0">⚠ '+c.alerte+'</p>':'')+'<p class="mini" style="margin:2px 0 0">'+c.tip+'</p>').join('')+'</div>').join('')}
   ${IMPOSES.map(c=>'<div class="fiche-block"><h4>'+c.n+'</h4><ul><li>'+c.ing.map(i=>'<b>'+i+'</b>').join('</li><li>')+'</li><li class="mini">Base : '+c.base+' · Famille : '+c.fam+' · Verre suggéré : '+c.verre+' · '+c.met+'</li></ul><p style="margin:8px 0 0;font-size:.93rem">'+c.hist+'</p><p class="mini" style="margin:6px 0 0;font-size:.88rem;font-style:italic;opacity:.85">'+c.note+'</p></div>').join('')}
  </div>
  <p class="fiche-lead" style="margin-top:18px"><b>Les repères qui font gagner du temps sous pression.</b> Base Roku : Gin Fizz, Raspberry Mule, Yellow Daisy, Jasmine (4 sur 13). Base Wild Turkey : Boulevardier, Frisco Sour, New York Sour. Base Appleton : Mai Tai, Planter's Punch, Banana Daiquiri. Un seul cognac (Harvard), un seul mezcal (Mezcal Mule), un seul Campari en base (Tampico). Deux mules seulement, et elles ne prennent pas le même agrume.</p>`},
 {t:"Le livre — Robert Vermeire", html:`
  <p class="fiche-lead">20 % du QCM porte sur cet extrait, et les questions peuvent tomber sur <b>l'ensemble</b> du contenu : préface, verres, matériel, termes, recettes et anecdotes.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>La fiche d'identité</h4><ul>
    <li><b>« L'Art du Cocktail »</b>, par <b>Robert Vermeire</b>, dit « Robert's ».</li>
    <li>Imprimerie de l'Office de Publicité, <b>16 rue Marcq, Bruxelles</b>.</li>
    <li>Traduction revue de <b>« Cocktails : How to Mix Them »</b>, Londres, <b>1922</b>, Herbert Jenkins &amp; Co.</li>
    <li><b>11 éditions, 68 317 exemplaires.</b> Préface reprise dans le <b>Querschnitt</b> de Berlin en <b>1925</b>. Édition japonaise : <b>K. Katayama</b>, Nishinomiya, <b>1930</b>.</li>
    <li>Vermeire a été six ans Head Barman au <b>Criterion</b> et à l'<b>Embassy</b> de Londres, sous les ordres de <b>Luigi Naintré</b>.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les origines du mot « cocktail »</h4><ul>
    <li><b>1.</b> Un historien américain : mot aztèque, <b>xocti</b>, venu d'<b>oxochiti</b>, du nom d'une jeune noble qui aurait offert la boisson à un roi.</li>
    <li><b>2.</b> <b>Thackeray</b> (1811-1863) et le dernier verre après les combats de coqs : « to the cocks tail ».</li>
    <li><b>3.</b> Une femme de lettres française : un mélange de liqueurs secoué à la glace, aux reflets variés comme la queue du coq.</li>
    <li><b>4. La version que Vermeire privilégie</b> : vers <b>1776</b>, l'aubergiste <b>Flanagan</b> (Elmsford ou Yorktown) perd son coq <b>Maître Chante-Clair</b> et promet la main de sa fille <b>Betsy</b> à qui le ramènera. Un officier de l'Indépendance le rapporte sans sa queue ; Betsy, troublée, se trompe de bouteilles.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 5 termes usuels</h4><ul>
    <li><b>REMUER</b> (stir up) — verre à mélange, glace en morceaux de préférence.</li>
    <li><b>FRAPPER</b> (shake) — au shaker, timbale à moitié pleine de glace en morceaux.</li>
    <li><b>PASSER</b> (strain) — transvaser à la passoire.</li>
    <li><b>PRESSER</b> (squeeze) — le jus, ou l'essence d'une pelure au-dessus du verre.</li>
    <li><b>TRAIT</b> (dash) ou tombée — une ou plusieurs gouttes au stilligoutte.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 5 verres</h4><ul>
    <li><b>N°1</b> verre à cocktail — rempli à <b>un demi-centimètre du bord</b> ; à moitié = liqueur ou pousse-café ; plein de glace pilée = liqueurs frappées.</li>
    <li><b>N°2</b> verre à porto — aux deux tiers.</li>
    <li><b>N°3</b> verre à sherry, <b>forme flûte</b> — aux deux tiers ; aussi vermouth, quinquina, amer.</li>
    <li><b>N°4</b> verre tulipe, <b>deux grandeurs</b> — moyen : vins, sours, crustas, juleps ; grand : longs drinks et champagne (à moitié).</li>
    <li><b>N°5</b> tumbler, <b>trois dimensions</b> — petit : flips, jus, champagne cocktail ; moyen : whisky et brandy soda, fizzes, collins ; grand : bières, cobblers, coolers, squashes.</li>
    <li class="mini">Règle absolue : <b>ne jamais remplir jusqu'au bord</b>. Et six verres par bouteille de champagne.</li>
   </ul></div>
   <div class="fiche-block"><h4>Le nécessaire (13 objets)</h4><ul>
    <li>Verre à mélange solide · shaker (deux timbales en argent, ou une timbale à couvercle-passoire, « très peu pratique ») · pelle à glace (ice scoop) · longue cuiller · cuiller-pilon · passoire à ressort</li>
    <li>4 à 6 flacons stilligouttes · presse-citron · pic à glace · tire-bouchon avec ouvre-bouteilles · couteau à fruits · râpe à muscade · cuiller et fourchette à fruits</li>
    <li class="mini">Épices citées : sel, poivre en grains, tabasco, poivre de Cayenne, muscade, cannelle, clous de girofle, sauce Worcestershire, vinaigre, ketchup.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les 8 bouteilles du « cocktail chez soi »</h4><ul>
    <li>1 dry gin de première qualité · 2 fine champagne de choix · 3 scotch whisky de marque · 4 vermouth français</li>
    <li>5 vermouth italien · 6 grenadine ou framboise · 7 Cointreau ou curaçao brun · 8 une petite bouteille d'angostura</li>
    <li class="mini">Son seul conseil : impossible de faire un bon cocktail avec de mauvaises liqueurs.</li>
   </ul></div>
   <div class="fiche-block"><h4>Le concours du Daily Mail — 1er mars 1937</h4><ul>
    <li><b>1600</b> barmen professionnels et amateurs · <b>3 prix</b> + <b>15 prix de consolation</b> · le jury n'a retenu que <b>25 recettes</b>.</li>
    <li><b>LIZZIE'S OWN</b> (shaker) : 1/2 Gordon's dry gin · 1/4 Courvoisier trois étoiles · 1/4 curaçao brun Fockink. Verre à cocktail, pelure de citron pressée. <b>15e et 17e prix</b>.</li>
    <li><b>RIKIKI</b> (shaker) : 1/3 armagnac · 1/3 calvados du Bon Roy d'Yvetot · 1/3 mandarine Candac.</li>
    <li><b>Vermeire est le seul concurrent à avoir remporté deux prix.</b></li>
   </ul></div>
   <div class="fiche-block"><h4>Les ponts avec les partenaires</h4><ul>
    <li><b>Grand Marnier</b> → cocktail <b>Handicap</b> : 1/3 Grand-Marnier, 2/3 Fruchtschaumwein (limonade gazeuse aux fruits, très bue à Dresde).</li>
    <li><b>Marie Brizard</b> → <b>Le Paradis du Zoute</b>, recette de Vermeire : 1/3 jus d'orange, 1/3 apry Marie Brizard, 1/3 Gordon's.</li>
    <li><b>Noilly Prat</b> → son <b>Dry Martini</b> personnel et le <b>Gloom Raiser</b>.</li>
    <li><b>Bénédictine</b> → cocktail <b>Fioupe</b> (une cuillerée, avec fine et cinzano).</li>
    <li><b>Harvard</b> → présent dans le livre <b>et</b> dans la liste des imposés : le pont parfait à citer devant le jury.</li>
   </ul></div>
   <div class="fiche-block"><h4>Ce que Vermeire revendique</h4><ul>
    <li>A <b>introduit</b> le Clover Club à Londres (R.A.C., <b>1915</b>) et le Cooperstown (via Lord Victor Paget).</li>
    <li>A <b>créé</b> le Gloom Raiser (R.A.C., 1915), le Silver Streak (1915), le <b>Dubonnet spécial / « Robert's Special »</b> après la <b>loi Vandervelde de 1919</b> (interdiction en Belgique des spiritueux &gt; 18°), le Rose Cocktail belge.</li>
    <li>A <b>lancé</b> le May Fair à l'Embassy de Londres en <b>1921</b>.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les équivalences à réciter</h4><ul>
    <li><b>Midnight</b> = Bronx + trait d'absinthe frappé ensemble · <b>Minnehaha</b> = le même, absinthe versée dans le verre (« eau riante », Shanghaï)</li>
    <li><b>East India</b> = Derby sans champagne · <b>White Lady</b> = Side-Car au gin · <b>Olivette</b> = London au Plymouth</li>
    <li><b>Ping-Pong</b> = Manhattan au sloe gin · <b>Star</b> = Klondyke + 2 traits de curaçao · <b>X.Y.Z.</b> = Bronx au citron</li>
    <li><b>Thistle</b> = York Cocktail · <b>Bamboo</b> = Reform Cocktail · <b>Mikado</b> = Japanese · <b>Chicago</b> = Fancy Brandy Cocktail</li>
    <li><b>Diabolo</b> = Young Man en France, <b>Oldman</b> au whisky · <b>Coffee</b> = Law's Cocktail · <b>Tuxedo</b> = Silver au Burnett gin + absinthe</li>
   </ul></div>
   <div class="fiche-block"><h4>Les noms décodés</h4><ul>
    <li><b>Bronx</b> = le parc et le zoo de New York · <b>Manhattan</b> = l'île · <b>Daïquiri</b> = une mine de fer à Cuba</li>
    <li><b>Ward Eight</b> = le 8e district de Boston · <b>May Fair</b> = la foire de mai sous Charles II · <b>Soixante-Quinze</b> = le canon de 14-18</li>
    <li><b>Meehoulong</b> = « diable qui mange le feu » (chinois) · <b>H.P.W.</b> = Harry Payne Whitney (par Charlie, du Racket Club)</li>
    <li><b>Depth Bomb</b> = la bombe des aviateurs anglais de 1914 · <b>Diki-Diki</b> = monarque de l'île d'Ubian, mort en 1922</li>
   </ul></div>
  </div>`},
 {t:"Écarts entre les documents", html:`
  <p class="fiche-lead">Le dossier finaliste et le règlement ne disent pas exactement la même chose. Ces écarts sont à vérifier au briefing — et ce sont typiquement les points où un candidat se trompe.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Giffard</h4><ul>
    <li>Le règlement listait <b>deux gammes</b> : les liqueurs sans alcool façon shrub (Ananas, Spritz, Triple Sec, Gingembre, Fleur de Sureau, Pamplemousse) <b>et</b> les Bases Cocktail.</li>
    <li>L'annexe #1 du dossier finaliste ne retient que la catégorie <b>« Base sans alcool »</b> avec <b>6 références</b> : Aperitif Bitter, Cold Cane, <b>Herbal Juniper</b>, Ruby Grape, Smoky Agave, Woody Malt.</li>
    <li class="mini">Deux différences : la gamme shrub n'apparaît plus, et <b>Herbal</b> + <b>Juniper</b> semblent fusionnés en une seule référence. À confirmer sur place.</li>
   </ul></div>
   <div class="fiche-block"><h4>Ponthier</h4><ul>
    <li>L'annexe #1 liste <b>4 purées</b> : Fruit de la Passion, Abricot, Figue de Barbarie, Framboise.</li>
    <li>Mais l'annexe #2 fait entrer la <b>purée de banane Ponthier</b> dans le Banana Daiquiri.</li>
    <li class="mini">Elle est donc fournie spécifiquement pour ce cocktail imposé, sans figurer dans la gamme générale. Ne pas la compter dans « les 4 purées » si la question tombe.</li>
   </ul></div>
   <div class="fiche-block"><h4>Ce qui ne bouge pas</h4><ul>
    <li>Tous les degrés de l'annexe #1 sont identiques à ceux du règlement — les fiches « Degrés pièges » restent valables telles quelles.</li>
    <li>Adriatico apparaît <b>deux fois</b> : en Zero (non alcool) et en spécialité (Bianco 16° / Classico 28°). Une seule maison, deux catégories.</li>
    <li>Même chose pour <b>BOWS</b> : eau-de-vie de cactus (Fiba) <b>et</b> whisky français (Benleioc). Et pour <b>Bacardi-Martini</b> : Noilly Prat <b>et</b> Bénédictine.</li>
   </ul></div>
   <div class="fiche-block"><h4>Rappel de la règle d'exclusivité</h4><ul>
    <li>Quand un secteur de produit est représenté par un fournisseur officiel, <b>seul ce produit ou cette gamme</b> peut être utilisé dans ta recette.</li>
    <li>Concrètement : un seul gin possible (Roku), un seul cognac (Merlet), un seul armagnac (Dartigalongue), un seul mixer (Fever-Tree), un seul bitter rouge (Campari)…</li>
    <li class="mini">Cette phrase figure deux fois dans le dossier : c'est un point que le jury connaît par cœur.</li>
   </ul></div>
  </div>`},
 {t:"Histoire du bar", html:`
  <p class="fiche-lead">50 % du QCM porte sur l'historique du bar, les spiritueux et les recettes. C'est le plus gros bloc de l'épreuve écrite.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Les livres fondateurs</h4><ul>
    <li><b>1862</b> — Jerry Thomas, <i>How to Mix Drinks, or The Bon-Vivant's Companion</i> : le premier livre de cocktails. Surnommé « le Professeur », auteur du Blue Blazer. La 2e édition (1876) codifie les Fizz.</li>
    <li><b>1882</b> — Harry Johnson, <i>New and Improved Bartender's Manual</i> : le premier à traiter la <b>gestion</b> d'un bar.</li>
    <li><b>1895</b> — George J. Kappeler, <i>Modern American Drinks</i> : première trace du <b>Harvard</b>.</li>
    <li><b>1922</b> — Robert Vermeire, <i>Cocktails: How to Mix Them</i> (Londres), traduit en <i>L'Art du Cocktail</i>.</li>
    <li><b>1927</b> — Harry McElhone, <i>Barflies and Cocktails</i> : le <b>Boulevardier</b>.</li>
    <li><b>1930</b> — Harry Craddock, <i>The Savoy Cocktail Book</i> : le <b>Yellow Daisy</b>.</li>
    <li><b>1934-1948</b> — Boothby, Beebe, Embury : le <b>Frisco</b>, sans citron.</li>
   </ul></div>
   <div class="fiche-block"><h4>Les dates qui font basculer le métier</h4><ul>
    <li><b>1860-1880</b> — le <b>phylloxéra</b> ravage le vignoble : le cognac se raréfie, le whisky et le gin le remplacent dans les cocktails. Le Sazerac passe du cognac au rye.</li>
    <li><b>1915</b> — interdiction de l'absinthe en France (Belgique 1906, Suisse 1910, États-Unis 1912).</li>
    <li><b>1920-1933</b> — <b>Prohibition</b> américaine : 18e amendement en vigueur le 17 janvier 1920, abrogation le 5 décembre 1933. Les barmen américains s'exilent à Londres, Paris et Cuba : c'est l'âge d'or du bar européen.</li>
    <li><b>1951</b> — fondation de l'<b>IBA</b>. <b>1955</b> premier concours (Amsterdam), <b>1961</b> première liste officielle.</li>
    <li><b>Années 1980</b> — renaissance du cocktail : Dick Bradsell à Londres, Dale DeGroff à New York.</li>
    <li><b>2011</b> — la mention « absinthe » redevient légale en France.</li>

   <div class="fiche-block"><h4>Les familles de cocktails</h4><ul>

 {t:"Spiritueux — la règle", html:`
  <p class="fiche-lead">Les définitions légales tombent souvent en QCM parce qu'elles ont une réponse unique et vérifiable. Base : règlement européen 2019/787.</p>
  <div class="fiche-grid">
   <div class="fiche-block"><h4>Les seuils à connaître par cœur</h4><ul>
    <li><b>Liqueur</b> : min. 15 % vol et <b>100 g/L</b> de sucre. Exceptions : cerise <b>70 g/L</b>, gentiane <b>80 g/L</b>.</li>
    <li><b>Crème de…</b> : min. <b>250 g/L</b> · <b>Crème de cassis</b> : min. <b>400 g/L</b>.</li>
    <li><b>Whisky</b> : min. <b>3 ans</b> en fûts ≤ 700 L, min. 40 % vol, distillé sous 94,8 % vol, aucune édulcoration.</li>
    <li><b>Gin</b> : genièvre <b>dominant</b>, min. <b>37,5 %</b> vol. <b>London gin</b> : aromatisation par redistillation seule, pas de colorant — ce n'est pas une origine géographique.</li>
    <li><b>Vodka</b> : min. 37,5 % vol.</li>
    <li><b>Rhum</b> : min. 37,5 % vol, sucrage plafonné à <b>20 g/L</b> ; un rhum « traditionnel » ne peut pas être édulcoré.</li>
    <li><b>Vermouth</b> : vin aromatisé, min. <b>75 % de vin</b>, 14,5 à 22 % vol, <b>armoise obligatoire</b>.</li>
   </ul></div>
   <div class="fiche-block"><h4>Cognac</h4><ul>
    <li><b>VS</b> 2 ans · <b>VSOP</b> 4 ans · <b>Napoléon</b> 6 ans · <b>XO</b> 10 ans (depuis 2018, contre 6 avant) · <b>XXO</b> 14 ans (créé en 2018).</li>
    <li>L'âge est toujours celui de la <b>plus jeune</b> eau-de-vie de l'assemblage.</li>
    <li><b>6 crus</b> : Grande Champagne, Petite Champagne, Borderies, Fins Bois, Bons Bois, Bois Ordinaires.</li>
    <li><b>Fine Champagne</b> = Grande + Petite Champagne, avec au moins 50 % de Grande.</li>
    <li>Double distillation en <b>alambic charentais</b>. Le sigle XO serait dû à Hennessy, vers 1870.</li>
   </ul></div>
   <div class="fiche-block"><h4>Armagnac, agave, sherry</h4><ul>
    <li><b>Armagnac</b> : distillation <b>continue</b> en colonne armagnacaise à bas degré (~58 %). Trois zones : <b>Bas-Armagnac</b>, <b>Ténarèze</b>, <b>Haut-Armagnac</b>. Tradition du millésime. La <b>Blanche d'Armagnac</b> est une AOC à part entière.</li>
    <li><b>Tequila</b> : Blanco · Reposado <b>2 mois à 1 an</b> · Añejo <b>1 à 3 ans</b> · Extra Añejo <b>+ de 3 ans</b>. « 100 % agave » contre « mixto » (min. 51 %). Numéro <b>NOM</b>, organisme <b>CRT</b>.</li>
    <li><b>Sherry</b> : <b>solera y criaderas</b>. Élevage <b>biologique</b> sous voile de flor (fino, manzanilla) contre élevage <b>oxydatif</b> (oloroso). L'amontillado commence sous flor et finit à l'oxydation.</li>
   </ul></div>
   <div class="fiche-block"><h4>Le vocabulaire de production</h4><ul>
    <li><b>Macération</b> à froid · <b>Infusion</b> à chaud · <b>Percolation</b> en continu · <b>Distillation</b> par point d'ébullition.</li>
    <li><b>Têtes / cœur / queues</b> : on n'embouteille que le cœur de chauffe.</li>
    <li><b>Alambic à repasse</b> (par lots, plus aromatique) contre <b>colonne</b> (continue, plus pure). Plus le degré de sortie est haut, plus le distillat est neutre.</li>
    <li><b>Part des anges</b> : 0,5 à 3 % évaporés par an — bien plus sous les tropiques.</li>
    <li><b>Mistelle</b> : moût de raisin muté à l'alcool, non fermenté (Noilly Prat, pineau, floc).</li>
   </ul></div>

 {n:"Rum Swizzle", cat:"Long", type:"All day", tav:20, met:"Swizzle stick", verre:"Highball (glace pilée)", ing:[["Rum ambré","50 ml"],["Jus de citron vert","30 ml"],["Velvet falernum","20 ml"],["Sirop de sucre","20 ml"],["Aromatic bitters","2 traits"]], g:"zeste d\u2019orange + menthe + paille", hist:"« Swizzle » = préparation au bâton lélé (5 branches). Boisson au rum désignée ainsi dès 1788.", varn:"Toutes les eaux-de-vie vieillies conviennent.", tdb:""},
 {n:"Sex on the Beach", cat:"Long", type:"All day", tav:15, met:"Shaker", verre:"Highball", ing:[["Vodka","40 ml"],["Jus d\u2019orange","40 ml"],["Nectar de cranberry","40 ml"],["Liqueur de pêche","10 ml"]], g:"demi-tranche d\u2019orange", hist:"Inventée aux États-Unis, popularisée à partir des années 1980.", varn:"", tdb:""},
 {n:"Spritz", cat:"Long", type:"Before dinner", tav:16, met:"Direct au verre", verre:"Verre à vin", ing:[["Vin blanc effervescent","60 ml"],["Bitter ou autre spiritueux","50 ml"],["Eau gazeuse","20 ml"]], g:"adaptée au spiritueux", hist:"D\u2019abord vin blanc + eau de Seltz ; l\u2019amer arrive dans les années 1920. Boisson signature de Venise. Prosecco à privilégier ; la marque du spiritueux précède le mot SPRITZ.", varn:"", tdb:"Campari Spritz, ou 0 % avec la base Giffard Aperitif Bitter."},
 {n:"Tequila Sunrise", cat:"Long", type:"All day", tav:13, met:"Direct au verre", verre:"Highball", ing:[["Jus d\u2019orange","80 ml"],["Tequila","40 ml"],["Sirop de grenadine (sans mélanger)","1 trait"]], g:"demi-tranche d\u2019orange + cerise + agitateur", hist:"Première version au Mexique vers 1930 ; version actuelle de 1972, adoptée par les Rolling Stones en tournée.", varn:"Le trait de grenadine crée le dégradé « lever de soleil ».", tdb:"Tequila : Calle 23 Blanco."},
];
const CHRONO = [
 {n:"Appleton Estate", y:1749},{n:"Marie Brizard", y:1755},{n:"Carpano (invente le vermouth)", y:1786},
 {n:"Noilly (recette)", y:1813},{n:"Combier", y:1834},{n:"Dartigalongue", y:1838},
 {n:"Famille Cortés (mezcal)", y:1840},{n:"Isautier", y:1845},{n:"Merlet", y:1850},
 {n:"Campari", y:1860},{n:"Bénédictine", y:1863},{n:"Site Wild Turkey", y:1869},
 {n:"Gabriel Boudier", y:1874},{n:"Grand Marnier", y:1880},{n:"Giffard", y:1885},
 {n:"Suntory", y:1899},{n:"Soleras La Ina", y:1919},{n:"Ponthier", y:1946},
 {n:"PCB Création", y:1992},{n:"Calle 23", y:2003},{n:"Fever-Tree", y:2004},
 {n:"Chinola", y:2014},{n:"BOWS", y:2016},{n:"Roku", y:2017},{n:"Adriatico", y:2019},{n:"Kota", y:2024},
 {n:"Lustau (Jerez)", y:1896},{n:"Solera Rio Viejo", y:1918},{n:"Distillerie Pigneret (\u2192 Sab's)", y:1941},
 {n:"1ers alambics Manguin", y:1957},{n:"Rhums arrang\u00e9s Isautier", y:1970},{n:"Carpano rachet\u00e9 par Branca", y:2001},
];


const CATS_ORDRE=["Marques partenaires","Histoire du bar","Créateurs & modern classics","Réglementation & production","Le livre — Vermeire","Cocktails imposés","Format du concours"];
const CAT_RX=[
 ["Le livre — Vermeire", /vermeire|robert's|l'art du cocktail|daily mail|lizzie|rikiki|querschnitt|katayama|flanagan|betsy|chante-clair|aztèque|xocti|thakeray|cocks tail|stilligoutte|mominette|suissesse|gloom raiser|clover club|silver streak|may fair|robert's special|vandervelde|dubonnet spécial|paradis du zoute|handicap|fioupe|minnehaha|east india|olivette|ping-pong|klondyke|thistle|bamboo|mikado|meehoulong|diki-diki|ward eight|soixante-quinze|za-za|millionnaire|glad eye|blackthorn|apple jack|jersey lightning|sunshine|stinger|limon|plain cocktail|fil de fer|68 317|1600 barmen|six verres par bouteille|nécessaire|8 bouteilles|yellow rattler|turf|whip|kurbag|martinez/i],
 ["Format du concours", /coefficient|épreuve écrite|épreuve sensorielle|épreuve pratique|le jury|finaliste|briefing|bastille|pre-batch|rétro-assemblage|combien de verres|temps de passage|tirage au sort|quelle part du qcm|combien de questions compte|équipe de 3|contenance du verre|où se tient la finale|dégustation/i],
 ["Cocktails imposés", /boulevardier|gin fizz|mai tai|planter|mezcal mule|banana daiquiri|raspberry mule|frisco|yellow daisy|tampico|jasmine|new york sour|harvard|imposé/i],
 ["Réglementation & production", /dans l'ue|minimum légal|liqueur de cerise|crème de cassis|vieillissement minimum|degré minimum|london gin|sucrage|comptes d'âge|vsop|\bxo\b|crus|fine champagne|reposado|añejo|mixto|vin aromatisé|part des anges|solera y criaderas|têtes|alambic à repasse|colonne|dry shake|throwing|swizzle|passoire|shaker cobbler|sirop de gomme|orgeat|mistelle|distillation/i],
 ["Créateurs & modern classics", /qui a (créé|inventé)|créé par|penicillin|paper plane|cosmopolitan|tommy's margarita|naked|oaxaca old|old cuban|porn ?star martini|breakfast martini|bramble|espresso martini|gold rush|red hook|trinidad sour|siesta|chartreuse swizzle|basil smash|calabrese|sam ross|audrey saunders|bradsell|degroff|simó|phil ward|ankrah|cecchini|bermejo/i],
 ["Histoire du bar", /prohibition|jerry thomas|harry johnson|craddock|savoy|ada coleman|iba|torquay|phylloxéra|mcelhone|harry's new york|ritz|floridita|tiki|donn beach|trader vic|volstead|speakeasy|kappeler|embury|boothby|premier livre|milano-torino|sazerac|singapore sling|vieux carré|hanky panky/i],
];
function catDe(q){
  if(q.cat) return q.cat;
  const t=(q.q||"")+" "+(q.e||"")+" "+((q.o&&q.o.join(" "))||"");
  for(const [nom,rx] of CAT_RX) if(rx.test(t)) return nom;
  return "Marques partenaires";
}
</script>
<script>
/* ============ ÉTAT ============ */
const KEY="culturebar-v1";
let mastered=new Set(), missed=new Set();
let actives=new Set(CATS_ORDRE);
let sessionLen=20, useChrono=true, skipMastered=true;
let view="quiz";

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"{}");
    mastered=new Set(d.m||[]); missed=new Set(d.w||[]);
    if(Array.isArray(d.c)&&d.c.length) actives=new Set(d.c.filter(c=>CATS_ORDRE.includes(c)));
    if(d.len) sessionLen=d.len;
    if(typeof d.ch==="boolean") useChrono=d.ch;
    if(typeof d.sk==="boolean") skipMastered=d.sk;
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({m:[...mastered],w:[...missed],c:[...actives],len:sessionLen,ch:useChrono,sk:skipMastered}));}catch(e){}
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ BANQUE ============ */
const BANK=(()=>{
  const out=[];
  const push=(q,opts,e,cat)=>{ if(opts.filter(o=>o.ok).length===1) out.push({q,opts,e,cat,id:out.length}); };
  QCM.forEach(q=>push(q.q, q.o.map((t,i)=>({t,ok:i===q.r})), q.e, catDe(q)));
  VF.forEach(v=>push(v.q, [{t:"VRAI",ok:v.r===true},{t:"FAUX",ok:v.r===false}], v.e, catDe(v)));
  DEGREES.forEach(d=>{
    const w=shuffle(DEGREES.filter(x=>x.d!==d.d)).slice(0,3);
    push("Quel est le degré de <b>"+d.n+"</b> ?",
      shuffle([{t:d.d,ok:true},...w.map(x=>({t:x.d,ok:false}))]),
      d.n+" titre "+d.d+".","Marques partenaires");
  });
  IMPOSES.forEach(c=>{
    const au=IMPOSES.filter(x=>x.n!==c.n);
    const wb=shuffle([...new Set(au.map(x=>x.base))].filter(b=>b!==c.base)).slice(0,3);
    if(wb.length===3) push("Quel est le spiritueux de base du <b>"+c.n+"</b> ?",
      shuffle([{t:c.base,ok:true},...wb.map(t=>({t,ok:false}))]),
      c.n+" : "+c.ing.join(" · "),"Cocktails imposés");
    const dehors=[...new Set(au.flatMap(x=>x.ing))].filter(i=>!c.ing.includes(i));
    const intrus=shuffle(dehors)[0];
    if(intrus) push("Lequel n'entre PAS dans le <b>"+c.n+"</b> ?",
      shuffle([{t:intrus,ok:true},...shuffle(c.ing).slice(0,3).map(t=>({t,ok:false}))]),
      "Composition officielle : "+c.ing.join(" · "),"Cocktails imposés");
    if(c.dose&&c.dose.length){
      const wd=shuffle(au.filter(x=>x.dose&&x.dose.length)).slice(0,3);
      if(wd.length===3) push("À quel cocktail correspond ce dosage ?<span class='note'>"+c.dose.map(d=>d[0]+" "+d[1]).join(" · ")+"</span>",
        shuffle([{t:c.n,ok:true},...wd.map(x=>({t:x.n,ok:false}))]),
        c.n+" — "+c.verre+", "+c.met+".","Cocktails imposés");
    }
  });
  VERM.filter(v=>v.note&&v.note.length>40
      && !/\d\s*\/\s*\d|traits? de|cuillerée|\d+\s*(tr|cl|c\.)\b/i.test(v.note)
      && !/^(Frapper|Remuer|Passer|Dans un verre|Verre à|Au shaker)/i.test(v.note)).forEach(v=>{
    const w=shuffle(VERM.filter(x=>x.n!==v.n)).slice(0,3);
    if(w.length===3) push("De quel cocktail de l'extrait Vermeire écrit-il ceci ?<span class='note'>"+v.note+"</span>",
      shuffle([{t:v.n,ok:true},...w.map(x=>({t:x.n,ok:false}))]),
      "<b>"+v.n+"</b> — "+v.m+" · "+v.r,"Le livre — Vermeire");
  });
  return out;
})();
const PAR_CAT=(()=>{const m=new Map(CATS_ORDRE.map(c=>[c,[]]));BANK.forEach(q=>m.get(q.cat).push(q.id));return m;})();

/* ============ VOLET ============ */
function statCat(c){
  const ids=PAR_CAT.get(c)||[];
  return {tot:ids.length, mas:ids.filter(i=>mastered.has(i)).length};
}
function dispo(){
  return BANK.filter(q=>actives.has(q.cat) && (!skipMastered || !mastered.has(q.id))).length;
}
function renderRail(){
  document.getElementById("brand-sub").textContent=BANK.length+" questions · révision active";
  const tot=BANK.length, mas=[...mastered].filter(i=>i<tot).length;
  const pct=tot?Math.round(mas/tot*100):0;
  document.getElementById("g-pct").textContent=pct+"%";
  document.getElementById("g-fill").style.width=pct+"%";
  document.getElementById("g-det").textContent=mas+" / "+tot+" maîtrisées";
  document.getElementById("cats").innerHTML=CATS_ORDRE.map(c=>{
    const s=statCat(c), p=s.tot?Math.round(s.mas/s.tot*100):0;
    return '<button class="cat'+(actives.has(c)?" on":"")+'" onclick="toggleCat('+JSON.stringify(c).replace(/"/g,"&quot;")+')">'+
      '<span class="box">'+(actives.has(c)?"✓":"")+'</span>'+
      '<span class="nm">'+c+'<span class="mini"><i style="width:'+p+'%"></i></span></span>'+
      '<span class="nb">'+s.mas+'/'+s.tot+'</span></button>';
  }).join("");
  document.getElementById("seg-len").innerHTML=[10,20,40,80].map(n=>
    '<button class="'+(sessionLen===n?"on":"")+'" onclick="setLen('+n+')">'+n+'</button>').join("");
  document.getElementById("sw-chrono").classList.toggle("on",useChrono);
  document.getElementById("sw-skip").classList.toggle("on",skipMastered);
}
function toggleCat(c){ actives.has(c)?actives.delete(c):actives.add(c); save(); renderRail(); if(!session) home(); }
function allCats(on){ actives=on?new Set(CATS_ORDRE):new Set(); save(); renderRail(); if(!session) home(); }
function weakCats(){
  actives=new Set(CATS_ORDRE.filter(c=>{const s=statCat(c);return s.tot&&s.mas/s.tot<.6;}));
  if(!actives.size) actives=new Set(CATS_ORDRE);
  save(); renderRail(); if(!session) home();
}
function setLen(n){ sessionLen=n; save(); renderRail(); if(!session) home(); }
function toggleChrono(){ useChrono=!useChrono; save(); renderRail(); }
function toggleSkip(){ skipMastered=!skipMastered; save(); renderRail(); if(!session) home(); }
function reset(){
  if(!confirm("Remettre toute la progression à zéro ?")) return;
  mastered.clear(); missed.clear(); save(); renderRail(); home();
}
function go(v){ view=v; if(v==="fiches") renderFiches(); else home(); }

/* ============ SESSION ============ */
let session=null, tick=null;
function home(){
  session=null; clearInterval(tick); view="quiz";
  const n=dispo();
  document.getElementById("stage").innerHTML=
    '<div class="hero"><h3>Composer la session</h3>'+
    '<p>Coche tes terrains dans le volet de gauche. Les questions ratées reviennent en priorité'+
    (skipMastered?", les acquises sont écartées":"")+'.</p>'+
    '<p style="color:var(--acc-hi);font-size:15px;margin-bottom:26px">'+
      (n?n+' question'+(n>1?'s':'')+' disponible'+(n>1?'s':'')+' · série de '+sessionLen:'Rien de disponible : coche une catégorie, ou désactive « écarter les acquises ».')+'</p>'+
    '<button class="btn" onclick="start()"'+(n?'':' disabled')+'>Commencer</button></div>';
  renderRail();
}
function start(){
  const pool=BANK.filter(q=>actives.has(q.cat) && (!skipMastered || !mastered.has(q.id)));
  if(!pool.length){ home(); return; }
  const rat=shuffle(pool.filter(q=>missed.has(q.id)));
  const neuf=shuffle(pool.filter(q=>!missed.has(q.id)));
  session={qs:shuffle([...rat,...neuf].slice(0,sessionLen)),i:0,ok:0,streak:0,best:0,done:[],byCat:new Map(),left:20};
  ask();
}
function ask(){
  const st=session, q=st.qs[st.i];
  clearInterval(tick); st.left=20;
  document.getElementById("stage").innerHTML=
   '<div class="card"><div class="q-top"><span class="tag">'+q.cat+'</span>'+
   '<div class="meters"><span>'+(st.i+1)+' / '+st.qs.length+'</span>'+
   '<span class="streak">◆ '+st.streak+'</span>'+
   (useChrono?'<span class="clock" id="clk">20</span>':'')+'</div></div>'+
   '<div class="bar"><i style="width:'+(100*st.i/st.qs.length)+'%"></i></div>'+
   '<div class="q">'+q.q+'</div><div class="opts" id="opts">'+
   q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'" onclick="answer('+k+')"><span class="ltr">'+"ABCD"[k]+'</span><span>'+o.t+'</span></button>').join("")+
   '</div><div class="exp" id="exp"><span class="h">Pour mémoire</span>'+(q.e||"")+'</div>'+
   '<div class="nav"><span class="kb"><kbd>1</kbd>–<kbd>4</kbd> répondre · <kbd>Entrée</kbd> suivant</span>'+
   '<button class="btn" id="nx" onclick="next()" disabled>Suivant</button></div></div>';
  if(useChrono) startClock();
}
function startClock(){
  const el=document.getElementById("clk"); if(!el) return;
  tick=setInterval(()=>{
    if(!session||session.answered) return;
    session.left--;
    el.textContent=session.left;
    el.className="clock"+(session.left<=5?" hot":session.left<=10?" warn":"");
    if(session.left<=0){ clearInterval(tick); answer(-1); }
  },1000);
}
function answer(k){
  const st=session; if(st.answered) return;
  st.answered=true; clearInterval(tick);
  const q=st.qs[st.i];
  const good = k>=0 && q.opts[k].ok;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.disabled=true; const j=+b.dataset.k;
    if(q.opts[j].ok) b.classList.add("good");
    else if(j===k) b.classList.add("bad");
    else b.classList.add("dim");
  });
  if(!st.byCat.has(q.cat)) st.byCat.set(q.cat,{ok:0,tot:0});
  const c=st.byCat.get(q.cat); c.tot++;
  if(good){ st.ok++; c.ok++; st.streak++; st.best=Math.max(st.best,st.streak); mastered.add(q.id); missed.delete(q.id); }
  else { st.streak=0; missed.add(q.id); mastered.delete(q.id); }
  st.done.push({q,good,k});
  save(); renderRail();
  document.getElementById("exp").classList.add("show");
  const nx=document.getElementById("nx");
  nx.disabled=false; nx.textContent = st.i===st.qs.length-1 ? "Voir le score" : "Suivant"; nx.focus();
  if(good) setTimeout(()=>{ const b=document.getElementById("nx"); if(b&&b.offsetParent!==null) b.click(); }, 850);
}
function next(){
  const st=session; if(!st.answered) return;
  if(st.i<st.qs.length-1){ st.i++; st.answered=false; ask(); }
  else result();
}
function result(){
  const st=session; clearInterval(tick);
  const pct=Math.round(st.ok/st.qs.length*100), C=2*Math.PI*70;
  let cls,txt;
  if(pct>=85){cls="or";txt="Le comptoir est tenu";}
  else if(pct>=60){cls="ok";txt="Solide, affine les détails";}
  else {cls="low";txt="Reprends les fiches";}
  const col = pct>=85?"var(--acc)":pct>=60?"var(--ok)":"var(--ko)";
  document.getElementById("stage").innerHTML=
   '<div class="hero"><div class="ring"><svg width="160" height="160">'+
   '<circle cx="80" cy="80" r="70" fill="none" stroke="var(--panel-2)" stroke-width="9"/>'+
   '<circle class="arc" cx="80" cy="80" r="70" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 '+C.toFixed(1)+'"/>'+
   '</svg><div class="ctr"><b>'+pct+'%</b><span>'+st.ok+' / '+st.qs.length+'</span></div></div>'+
   '<div class="verdict '+cls+'">'+txt+'</div>'+
   '<p>Meilleure série : '+st.best+'. Maîtrise globale : '+[...mastered].length+' / '+BANK.length+'.</p>'+
   '<div class="recap">'+[...st.byCat.entries()].sort((a,b)=>b[1].tot-a[1].tot).map(([n,s])=>
     '<div class="l"><span class="n">'+n+'</span><span class="m"><i data-w="'+Math.round(s.ok/s.tot*100)+'" style="width:0"></i></span><span class="s">'+s.ok+'/'+s.tot+'</span></div>').join("")+'</div>'+
   '<div class="acts"><button class="btn" onclick="start()">Nouvelle série</button>'+
   (missed.size?'<button class="btn ghost" onclick="startMissed()">Rejouer les ratées ('+missed.size+')</button>':'')+
   '<button class="btn ghost" onclick="home()">Changer la sélection</button></div>'+
   '<div class="rev"><h3>La correction</h3>'+st.done.map(d=>{
      const bon=d.q.opts.find(o=>o.ok);
      return '<div class="rv '+(d.good?"ok":"ko")+'"><span class="st">'+(d.good?"✓":"✗")+'</span>'+d.q.q+
        '<br><span class="an">'+(bon?bon.t:"")+'</span><span class="ex">'+(d.q.e||"")+'</span></div>';
   }).join("")+'</div></div>';
  requestAnimationFrame(()=>{
    const a=document.querySelector(".ring .arc");
    if(a) a.setAttribute("stroke-dasharray",(C*pct/100).toFixed(1)+" "+C.toFixed(1));
    document.querySelectorAll(".recap .m i").forEach(el=>el.style.width=el.dataset.w+"%");
  });
  session=null; renderRail();
}
function startMissed(){
  const pool=BANK.filter(q=>missed.has(q.id)&&actives.has(q.cat));
  if(!pool.length){ home(); return; }
  session={qs:shuffle(pool).slice(0,sessionLen),i:0,ok:0,streak:0,best:0,done:[],byCat:new Map(),left:20};
  ask();
}

/* ============ FICHES ============ */
function renderFiches(){
  clearInterval(tick); session=null;
  document.getElementById("stage").innerHTML=
    '<input class="srch" type="search" placeholder="Chercher dans les fiches…" oninput="filtFiches(this.value)">'+
    '<div id="fl">'+FICHES.map((f,i)=>
      '<div class="fiche" data-t="'+(f.t+" "+f.html).replace(/<[^>]+>/g," ").toLowerCase().replace(/"/g,"")+'">'+
      '<button onclick="this.parentElement.classList.toggle(\'open\')"><span class="nu">'+String(i+1).padStart(2,"0")+'</span>'+f.t+'</button>'+
      '<div class="bd"><div>'+f.html+'</div></div></div>').join("")+'</div>';
}
function filtFiches(v){
  v=v.trim().toLowerCase();
  document.querySelectorAll("#fl .fiche").forEach(f=>{ f.style.display=(!v||f.dataset.t.includes(v))?"":"none"; });
}

/* ============ CLAVIER ============ */
document.addEventListener("keydown",e=>{
  if(!session) return;
  if(e.key==="Enter"){ e.preventDefault(); next(); return; }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4&&!session.answered){ const o=document.querySelectorAll("#opts .opt"); if(o[n-1]) o[n-1].click(); }
});

/* ============ INIT ============ */
load(); renderRail(); home();
</script>
</body>
</html>
