<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture Bar — Révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12100D; --panel:#1A1713; --panel-2:#221E19; --line:#332C24;
  --ink:#F1EADC; --dim:#9B8D78;
  --acc:#C9903F; --acc-hi:#E4B463; --acc-deep:#8E5F24;
  --ok:#7E9B3A; --ok-ink:#0E0C08; --ko:#B8453C;
  --r:8px;
  --disp:'Cormorant Garamond',Georgia,serif;
  --body:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(120% 60% at 50% -14%,rgba(201,144,63,.10),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
::selection{background:rgba(201,144,63,.35)}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:26px 20px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.main{padding:34px 30px 80px;max-width:820px;margin:0 auto;width:100%}

/* ---------- Marque ---------- */
.brand{margin-bottom:8px}
.brand .kick{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--acc-deep);font-weight:600;margin-bottom:8px}
.brand h1{font-family:var(--disp);font-weight:700;font-size:38px;line-height:.95;
  background:linear-gradient(170deg,var(--acc-hi) 15%,var(--acc) 55%,var(--acc-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:12.5px;color:var(--dim);font-weight:300;margin-top:8px}
.rule{height:1px;margin:20px 0;background:linear-gradient(90deg,var(--acc-deep),var(--line) 70%,transparent)}

/* ---------- Jauge ---------- */
.gauge{margin-bottom:6px}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.gauge .pct{font-family:var(--disp);font-size:30px;font-weight:700;color:var(--acc-hi);line-height:1}
.gauge .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.gauge .track{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.gauge .track i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--acc-deep),var(--acc),var(--acc-hi));transition:width .7s cubic-bezier(.22,.61,.36,1)}
.gauge .det{font-size:11.5px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}

/* ---------- Volet catégories ---------- */
.rail h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 11px}
.cats{display:grid;gap:5px;margin-bottom:6px}
.cat{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:var(--r);color:var(--dim);
  padding:9px 11px;font-family:var(--body);font-size:13.5px;transition:.16s}
.cat:hover{color:var(--ink);background:var(--panel-2)}
.cat.on{color:var(--ink);border-color:rgba(201,144,63,.4);background:rgba(201,144,63,.09)}
.box{width:17px;height:17px;flex:0 0 17px;border:1.5px solid var(--line);border-radius:5px;
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ok-ink);transition:.16s}
.cat.on .box{background:var(--acc);border-color:var(--acc)}
.cat .nm{flex:1;line-height:1.25}
.cat .nb{font-size:11px;color:var(--acc-deep);font-variant-numeric:tabular-nums}
.cat.on .nb{color:var(--acc)}
.cat .mini{display:block;height:2px;background:var(--panel-2);border-radius:2px;margin-top:4px;overflow:hidden}
.cat .mini i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .6s}
.links{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px}
.lnk{background:none;border:none;color:var(--acc-deep);font-family:var(--body);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;padding:3px 0;transition:.18s}
.lnk:hover{color:var(--acc-hi)}

/* ---------- Réglages ---------- */
.seg{display:flex;gap:5px;margin-bottom:6px}
.seg button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
  font-family:var(--body);font-size:13px;font-weight:500;padding:9px 4px;border-radius:6px;cursor:pointer;transition:.16s}
.seg button:hover{color:var(--ink);border-color:var(--acc-deep)}
.seg button.on{background:rgba(201,144,63,.16);border-color:var(--acc);color:var(--ink)}
.row-tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.row-tog .t{font-size:13px;color:var(--dim)}
.sw{position:relative;width:42px;height:24px;border-radius:24px;border:1px solid var(--line);
  background:var(--bg);cursor:pointer;padding:0;flex-shrink:0;transition:.2s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.22s}
.sw.on{background:linear-gradient(180deg,var(--acc-hi),var(--acc));border-color:transparent}
.sw.on i{transform:translateX(18px);background:#1c1408}

/* ---------- Boutons ---------- */
.btn{font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(180deg,var(--acc-hi),var(--acc));color:#1c1408;border:none;
  padding:14px 30px;border-radius:var(--r);cursor:pointer;transition:.2s;
  box-shadow:0 8px 24px rgba(201,144,63,.22)}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc);box-shadow:none}
.btn.ghost:hover{background:rgba(201,144,63,.1)}
.btn.full{width:100%}
.btn.sm{padding:10px 18px;font-size:11.5px}

/* ---------- Carte de question ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:30px 30px 26px;box-shadow:0 18px 48px rgba(0,0,0,.4);animation:in .35s cubic-bezier(.22,.61,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc-deep);font-weight:600;
  border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.meters{display:flex;gap:16px;align-items:center;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.streak{color:var(--acc-hi);font-weight:600}
.clock{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:600}
.clock.warn{color:var(--acc)}
.clock.hot{color:var(--ko);animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.bar{height:3px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc-deep),var(--acc-hi));transition:width .45s}
.q{font-size:20px;line-height:1.42;margin-bottom:22px;text-wrap:pretty}
.q b{color:var(--acc-hi);font-weight:600}
.q .note{display:block;margin-top:10px;font-size:15px;color:var(--dim);font-weight:300;line-height:1.55}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);
  padding:14px 16px;font-family:var(--body);font-size:15.5px;font-weight:300;cursor:pointer;
  transition:border-color .16s,transform .16s,background .2s;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(3px)}
.opt:disabled{cursor:default}
.ltr{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--acc-deep);
  min-width:28px;height:28px;border:1px solid var(--line);border-radius:6px;
  display:grid;place-items:center;flex-shrink:0;transition:.16s}
.opt:hover:not(:disabled) .ltr{color:var(--acc);border-color:var(--acc)}
.opt.good{border-color:var(--ok);background:rgba(126,155,58,.13)}
.opt.good .ltr{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.opt.bad{border-color:var(--ko);background:rgba(184,69,60,.13)}
.opt.bad .ltr{background:var(--ko);border-color:var(--ko);color:#fff}
.opt.dim{opacity:.4}
.exp{display:none;margin-top:20px;background:rgba(201,144,63,.07);border-left:2px solid var(--acc);
  padding:15px 17px;border-radius:0 var(--r) var(--r) 0;font-size:15px;font-weight:300;line-height:1.6}
.exp.show{display:block;animation:in .3s}
.exp .h{display:block;color:var(--acc);font-weight:600;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:5px}
.exp b{color:var(--acc-hi);font-weight:500}
.nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.kb{font-size:11.5px;color:var(--dim)}
.kb kbd{border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-family:var(--body);font-size:10.5px;color:var(--acc-deep)}

/* ---------- Accueil / résultat ---------- */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:38px 32px;text-align:center}
.hero h3{font-family:var(--disp);font-size:29px;font-weight:600;color:var(--acc-hi);margin-bottom:6px}
.hero p{color:var(--dim);font-weight:300;max-width:52ch;margin:0 auto 22px;text-wrap:pretty}
.ring{position:relative;width:160px;height:160px;margin:0 auto 16px}
.ring svg{transform:rotate(-90deg)}
.ring .arc{transition:stroke-dasharray 1s cubic-bezier(.22,.61,.36,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .ctr b{font-family:var(--disp);font-size:42px;font-weight:700;color:var(--acc-hi);line-height:1}
.ring .ctr span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.verdict{font-family:var(--disp);font-size:24px;font-weight:600;margin-bottom:6px}
.verdict.or{color:var(--acc-hi)} .verdict.ok{color:var(--ok)} .verdict.low{color:var(--ko)}
.recap{display:grid;gap:8px;max-width:430px;margin:22px auto 26px;text-align:left}
.recap .l{display:flex;align-items:center;gap:11px;font-size:13px}
.recap .l .n{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recap .l .m{flex:1.3;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.recap .l .m i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .7s}
.recap .l .s{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}

/* ---------- Revue / fiches ---------- */
.rev{margin-top:26px}
.rev h3{font-family:var(--disp);font-size:22px;color:var(--acc-hi);margin-bottom:12px}
.rv{border-bottom:1px solid var(--line);padding:13px 0;font-size:14.5px;font-weight:300}
.rv .st{font-weight:600;margin-right:6px}
.rv.ok .st{color:var(--ok)} .rv.ko .st{color:var(--ko)}
.rv .an{color:var(--acc-hi);font-weight:500}
.rv .ex{display:block;color:var(--dim);font-size:13.5px;margin-top:4px}
.fiche{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.fiche > button{display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;
  background:none;border:none;color:var(--ink);padding:16px 20px;font-family:var(--body);font-size:16px}
.fiche > button:hover{color:var(--acc-hi)}
.fiche .nu{font-family:var(--disp);font-weight:700;color:var(--acc);font-size:13px;min-width:34px;height:34px;
  border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.fiche .bd{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.22,.61,.36,1)}
.fiche.open .bd{max-height:6000px}
.fiche .bd > div{padding:4px 22px 22px;border-top:1px solid var(--line);font-weight:300;font-size:14.5px}
.fiche h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:16px 0 6px}
.fiche ul{list-style:none;margin:6px 0}
.fiche li{position:relative;padding-left:18px;margin:7px 0;line-height:1.55}
.fiche li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--acc-deep)}
.fiche b{color:var(--acc-hi);font-weight:500}
.fiche .fiche-grid{display:grid;gap:14px}
.fiche .fiche-lead{font-style:italic;color:var(--dim);margin-bottom:10px}
.fiche .mini{font-size:.9em;opacity:.8;font-style:italic}
.srch{display:block;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font-family:var(--body);font-size:14.5px;padding:12px 17px;border-radius:var(--r);outline:none;margin-bottom:20px}
.srch:focus{border-color:var(--acc)}
.mt{margin-top:26px}

@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .main{padding:24px 18px 70px}
  .q{font-size:18px}
  .kb{display:none}
}
</style>
</head>
<body>
<div class="app">

<aside class="rail">
  <div class="brand">
    <div class="kick">Jocelyn Soubise</div>
    <h1>Culture Bar</h1>
    <div class="sub" id="brand-sub"></div>
  </div>

  <div class="gauge">
    <div class="top"><span class="pct" id="g-pct">0%</span><span class="lbl">maîtrise</span></div>
    <div class="track"><i id="g-fill"></i></div>
    <div class="det" id="g-det"></div>
  </div>

  <div class="rule"></div>

  <h2>Catégories</h2>
  <div class="cats" id="cats"></div>
  <div class="links">
    <button class="lnk" onclick="allCats(true)">Tout</button>
    <button class="lnk" onclick="allCats(false)">Rien</button>
    <button class="lnk" onclick="weakCats()">Points faibles</button>
  </div>

  <div class="rule"></div>

  <h2>Longueur</h2>
  <div class="seg" id="seg-len"></div>

  <div class="row-tog">
    <span class="t">Chrono 20 s</span>
    <button class="sw" id="sw-chrono" onclick="toggleChrono()"><i></i></button>
  </div>
  <div class="row-tog">
    <span class="t">Écarter les acquises</span>
    <button class="sw" id="sw-skip" onclick="toggleSkip()"><i></i></button>
  </div>

  <div class="rule"></div>
  <div class="links">
    <button class="lnk" onclick="go('quiz')">Quiz</button>
    <button class="lnk" onclick="go('fiches')">Fiches</button>
    <button class="lnk" onclick="reset()">Remise à zéro</button>
  </div>
</aside>

<main class="main" id="stage"></main>
</div>

<script>
const IMP_GROUPES=["Gin","Whiskey américain","Rhum","Agave","Cognac","Amer"];
const IMP_VERRES=["Coupe","Rocks","Highball"];
const QCM = [
 {q:"Le tout premier triple sec au monde a été créé par :", o:["Cointreau","Combier","Giffard","Marie Brizard"], r:1, e:"Combier, 1834, Saumur — créé pour fourrer les bonbons de la confiserie Combier-Destre."},
 {q:"La salle des alambics de la distillerie Combier est attribuée :", o:["Aux ateliers Eiffel","À Viollet-le-Duc","Aux frères Perret","À Vauban"], r:0, e:"La salle des alambics du XIXe est signée des ateliers Eiffel."},
 {q:"Le Negroni est né :", o:["À Milan en 1860","À Turin en 1786","À Florence en 1919","À Venise en 1948"], r:2, e:"Florence, 1919 : le comte Camillo Negroni corse son Americano au gin au Caffè Casoni."},
 {q:"La solera du fino La Ina a été fondée en 1919 par :", o:["Lustau","González Byass","Pedro Domecq","Osborne"], r:2, e:"Pedro Domecq ; soleras et marque passées chez Lustau en 2008."},
 {q:"Rio Viejo est un sherry de style :", o:["Fino","Manzanilla","Oloroso","Amontillado"], r:2, e:"Oloroso : élevage oxydatif sans flor, sec mais ample (noix, tabac), 20°."},
 {q:"Les vins de base de Noilly Prat sont issus des cépages :", o:["Ugni Blanc et Colombard","Picpoul et Clairette","Palomino et PX","Chardonnay et Aligoté"], r:1, e:"Picpoul (de Pinet) et Clairette, vins blancs secs du Languedoc. Ugni Blanc/Colombard = l'Eau de Vigne Merlet !"},
 {q:"La note signature de l'Antica Formula est :", o:["La rhubarbe","La vanille de Madagascar","Le safran","Le quinquina"], r:1, e:"La vanille de Madagascar — signature de la recette historique de 1786."},
 {q:"Lequel n'est PAS un botanique japonais du Roku ?", o:["Thé sencha","Poivre sanshō","Ginseng","Feuille de sakura"], r:2, e:"Le ginseng. Les six : fleur + feuille de sakura, sencha, gyokuro, sanshō, yuzu."},
 {q:"Le nom « Wild Turkey » vient :", o:["Du fondateur Thomas Turkey","D'une chasse au dindon sauvage en 1940","D'une rivière du Kentucky","D'un cocktail de 1919"], r:1, e:"1940 : Thomas McCarthy apporte du bourbon à une chasse au dindon sauvage."},
 {q:"Le rhum Isautier Double Agent Fusion est obtenu par :", o:["Assemblage de deux rhums finis","Co-fermentation de 36 h de mélasse et pur jus","Double distillation","Finish en fût de cognac"], r:1, e:"Co-fermentation 36 h mélasse + pur jus (50/50), colonne, puis 2,5 ans de repos en cuve."},
 {q:"Joy Spence est devenue master blender d'Appleton en :", o:["1988","1997","2005","2012"], r:1, e:"1997 — première femme master blender de toute l'industrie des spiritueux."},
 {q:"Le nom « Calle 23 » vient :", o:["Du 23e essai de recette","D'une plaque de rue à Guadalajara","De l'adresse de la distillerie","Du 23e anniversaire de Sophie"], r:1, e:"Une vieille plaque de rue aperçue à Guadalajara le jour où la recette fut validée."},
 {q:"Nuestra Soledad rend hommage à :", o:["Un village d'agaves","La grand-mère des Cortés","La Vierge de la Solitude, patronne d'Oaxaca","Une chanson zapotèque"], r:2, e:"La Virgen de la Soledad, sainte patronne de la ville d'Oaxaca."},
 {q:"Laquelle de ces affirmations sur le pisco péruvien est VRAIE ?", o:["Il vieillit 6 mois en fût","Il est distillé deux fois","Il est réduit à l'eau de source","Il est distillé directement à son degré final, sans eau ajoutée"], r:3, e:"Distillation unique, à degré : ni eau ajoutée, ni bois — repos min. 3 mois en contenant inerte."},
 {q:"Le plus vieux millésime authentifié de l'armagnac, conservé chez Dartigalongue, date de :", o:["1813","1838","1848","1900"], r:2, e:"1848, conservé au « Paradis » de Nogaro."},
 {q:"Le Merlet Brothers Blend assemble majoritairement :", o:["De la Grande Champagne + 1/5 de Fins Bois","Des Fins Bois + 1/5 de Grande Champagne","Des Borderies pures","Du Bois Ordinaire"], r:1, e:"Majorité Fins Bois + 1/5 Grande Champagne, eaux-de-vie de 4 ans minimum."},
 {q:"Le finish du Sab's « Le Marc » se fait en :", o:["Fût de sauternes","Fût de cognac","Fût de porto","Amphore"], r:1, e:"Fût de cognac (6 mois), après 4 ans en petits fûts bourguignons de 228 L."},
 {q:"Les feuilles de pandan de Kota proviennent :", o:["Du Vietnam","Des Philippines","De Thaïlande","D'Indonésie"], r:2, e:"Thaïlande — feuilles fraîches macérées puis distillées chez Boudier."},
 {q:"Le café d'Algebra est torréfié par :", o:["Monmouth","Has Bean","Square Mile","Merling"], r:1, e:"Has Bean (Londres), café de spécialité en sourcing équitable. Merling = le torréfacteur du C² de Merlet !"},
 {q:"Le Grand Marnier Cordon Rouge contient :", o:["30 % de cognac","51 % de cognac","70 % de cognac","Aucun cognac"], r:1, e:"51 % de cognac dans le Cordon Rouge, marié à la bigarade des Caraïbes."},

 /* ===== APPROFONDISSEMENT ===== */
 {q:"Le Fiba de BOWS est élaboré à partir :", o:["Des fruits mûrs du figuier de Barbarie","Des raquettes du cactus, fumées au bois d'olivier","Des fleurs séchées d'opuntia","D'un jus de cactus fermenté en cuve"], r:1, e:"Ce sont les RAQUETTES (Opuntia ficus-indica), coupées puis fumées au bois d'olivier, macérées et distillées. Le fumé ne vient donc pas d'un four enterré."},
 {q:"Chez Dartigalongue, le Single-Oaked est élevé :", o:["Dans un seul fût neuf","Dans un seul type de fûts : des fûts de chêne roux (déjà utilisés)","En fût de cognac","En amphore"], r:1, e:"« Single » = un seul TYPE de fût. Les fûts roux préservent le fruit ; ce sont les fûts neufs du Double-Oaked qui apportent les tanins et la torréfaction."},
 {q:"À quelle saison le poivre sanshō du Roku est-il récolté ?", o:["Printemps","Été","Automne","Hiver"], r:2, e:"Automne. Printemps = sakura (fleur + feuille), été = sencha + gyokuro, hiver = yuzu."},
 {q:"Le Campari s'appelait à l'origine :", o:["Rosso Milano","Bitter all'uso d'Hollanda","Elisir di Novara","Aperitivo Reale"], r:1, e:"Bitter à la façon de la Hollande, en référence au cordial hollandais qui a inspiré Gaspare Campari."},
 {q:"L'Antica Formula de Carpano est élaborée avec environ :", o:["30 botaniques","60 botaniques","130 botaniques","200 botaniques"], r:2, e:"Environ 130 botaniques, en extraction à chaud ET à froid. Vanilles de Madagascar, Tahiti et Papouasie, safran d'Iran, armoise du Piémont."},
 {q:"Chez Noilly Prat, le dodinage a lieu :", o:["Une fois par semaine","Deux fois par jour pendant 21 jours","En continu pendant un an","Uniquement au moment de l'assemblage"], r:1, e:"Deux fois par jour pendant les trois semaines de macération, à la main, dans la Salle des Secrets."},
 {q:"« Kota » signifie :", o:["Pandan","Ville","Feuille","Soleil"], r:1, e:"« Kota » = la ville, en indonésien et en malais. Rien à voir avec la plante elle-même."},
 {q:"Les liqueurs Giffard Sans Alcool sont macérées dans :", o:["De l'eau chaude","Du vinaigre de vin blanc","Du vinaigre de cidre","De la glycérine végétale"], r:1, e:"Vinaigre de vin blanc français, technique inspirée du shrub, puis un procédé maison efface les notes de vinaigre."},
 {q:"Wild Turkey entre en fût à un degré :", o:["Supérieur au maximum légal","Exactement au maximum légal de 125 proof","Volontairement plus bas que le maximum légal","Différent chaque année"], r:2, e:"107 proof historiquement, 115 aujourd'hui, contre 125 autorisés. Moins d'alcool à l'entrée = plus de goût, moins d'eau à la fin."},
 {q:"L'Un-Oaked de Dartigalongue est réduit à :", o:["40°","43,2°","45°","46°"], r:1, e:"58° à la sortie d'alambic, puis réduction lente en cuve inox jusqu'à 43,2°. C'est une Blanche Armagnac, AOC à part entière."},
 {q:"Pourquoi l'olive ne peut-elle pas être fermentée puis distillée comme un fruit ?", o:["Elle contient trop d'huile","Elle ne contient pas de sucre fermentescible","Elle est trop amère","Sa peau est trop dure"], r:1, e:"Pas de sucre fermentescible : on macère donc les olives dans l'alcool avant de distiller, comme pour un gin. LA phrase à sortir sur l'Oli'Still."},
 {q:"Combien de botas Lustau a-t-elle reprises à Domecq en 2008 ?", o:["400","1 000","4 000","10 000"], r:2, e:"4 000 botas, déplacées d'un bout à l'autre de Jerez, avec les marques La Ina, Botaina, Rio Viejo et Viña 25."},
 {q:"Dans l'Union européenne, quelles liqueurs ont un minimum de sucre INFÉRIEUR à 100 g/L ?", o:["Les liqueurs de café et de cacao","Les liqueurs de cerise (70 g/L) et de gentiane (80 g/L)","Les liqueurs d'agrumes","Aucune : 100 g/L est un plancher absolu"], r:1, e:"Deux exceptions traditionnelles seulement. C'est pour ça qu'Algebra, à 100 g/L pile, est la liqueur de café la plus sèche possible."},
 {q:"La marque Wild Turkey a été créée en 1940 par :", o:["Les frères Ripy","Austin Nichols & Co., grossiste new-yorkais","Le groupe Campari","Jimmy Russell"], r:1, e:"Austin Nichols & Co. — Thomas McCarthy en était le dirigeant. La distillerie des frères Ripy n'a été rachetée qu'en 1972."},
 {q:"Antoinette Isautier prend la direction de la maison en 1865 parce que :", o:["Elle rachète les parts de ses beaux-frères","Son mari Charles vient de mourir","Elle est la fille du fondateur","Elle revient de métropole"], r:1, e:"Elle était l'épouse de Charles Isautier et reprend l'entreprise à sa mort — une femme à la tête d'une distillerie au XIXe siècle."},
 {q:"La solera de l'Oloroso Rio Viejo a été fondée en :", o:["1870","1918","1919","1945"], r:1, e:"1918 pour Rio Viejo, 1919 pour le Fino La Ina. Un an d'écart : le genre de détail qui départage."},
 {q:"Le nom « Sab's » vient :", o:["Uniquement du nom Sabbagh","Des initiales de Société Alambic Bourguignon ET du surnom du fondateur","D'un lieu-dit près de Beaune","Du nom du premier alambic"], r:1, e:"Double sens assumé : Société Alambic Bourguignon + le surnom de Mathieu Sabbagh."},
 {q:"Les amandes Filippo Cea d'Adriatico sont récoltées à la main dans la campagne de :", o:["Bari","Alberobello","Lecce","Tarente"], r:1, e:"Alberobello, dans les Pouilles. Le sel, lui, vient de la saline de Margherita di Savoia."},
 {q:"Le café d'Algebra est torréfié :", o:["Dans le Kent","Dans le Staffordshire","Dans le Yorkshire","En Écosse"], r:1, e:"Has Bean torréfie dans le Staffordshire ; l'extrait est ensuite fabriqué au laboratoire londonien d'Algebra."},
 {q:"Franck Choisne a dû faire modifier un décret de 1988 pour réautoriser :", o:["La thuyone","Le fenouil dans la composition","L'anis vert","La coloration à la chlorophylle"], r:1, e:"Le fenouil — sans lui, impossible de refaire une absinthe historique. La mention « absinthe » sur l'étiquette n'est venue qu'en 2011."},
 {q:"La distillerie rachetée par Mathieu Sabbagh en 2018 s'appelait :", o:["Pigneret","Cartron","Vedrenne","Briottet"], r:0, e:"La distillerie Pigneret, fondée en 1941 à Moroges, rebaptisée Alambic Bourguignon et installée à Beaune."},
 {q:"Les trois marques de mezcal de Casa Cortés sont :", o:["Agave de Cortés, Nuestra Soledad, El Jolgorio","Nuestra Soledad, Del Maguey, El Jolgorio","Agave de Cortés, Matatlán, Espadín Real","El Jolgorio, Soledad, Zapoteca"], r:0, e:"Agave de Cortés (volume), Nuestra Soledad (single village) et El Jolgorio (agaves sauvages rares)."},
 {q:"La liqueur bleue Hpnotiq a été créée en 2001 par :", o:["Marie Brizard","Merlet","Gabriel Boudier","Combier"], r:1, e:"C'est la distillerie Merlet qui l'a mise au point — une anecdote qui surprend toujours."},
 {q:"Les fondateurs de Fever-Tree ont documenté leur recherche sur la quinine :", o:["Au Kew Gardens","À la British Library","Au Musée d'histoire naturelle","Aux archives de Plymouth Gin"], r:1, e:"À la British Library, sur des sources remontant à 1620, avant d'aller sourcer l'écorce à la frontière Rwanda / RD Congo."},
 {q:"Chez Ponthier, la composition d'une purée respecte :", o:["Minimum 70 % de fruit","Minimum 90 % de fruit et maximum 10 % de sucre de canne","50 % de fruit et 50 % de sirop","Un ratio libre selon le fruit"], r:1, e:"Minimum 90 % de fruit, maximum 10 % de sucre, aucun additif. Une seule origine et une seule variété par parfum."},


 /* ===== LIVRE ANCIEN — ROBERT VERMEIRE ===== */
 {q:"« L'Art du Cocktail » est la traduction revue de quel ouvrage ?", o:["The Savoy Cocktail Book","Cocktails : How to Mix Them","Harry's ABC of Mixing Cocktails","The Fine Art of Mixing Drinks"], r:1, e:"Publié en 1922 à Londres par Herbert Jenkins & Co. Onze éditions, 68 317 exemplaires."},
 {q:"Où « L'Art du Cocktail » a-t-il été imprimé ?", o:["À Paris","À Londres","À Bruxelles","À New York"], r:2, e:"Imprimerie de l'Office de Publicité, 16 rue Marcq, Bruxelles."},
 {q:"Selon la version privilégiée par Vermeire, comment s'appelait le coq de Flanagan ?", o:["Chanteclerc","Maître Chante-Clair","Le Grand Rouge","Betsy"], r:1, e:"Sa disparition, vers 1776, déclenche toute l'histoire ; la fille de l'aubergiste s'appelait Betsy."},
 {q:"Dans quelle revue la préface de Vermeire a-t-elle été publiée en 1925 ?", o:["Le Querschnitt, de Berlin","Le Punch, de Londres","La Revue du Bar, de Paris","Le Mixer, de Vienne"], r:0, e:"Revue mensuelle berlinoise. L'édition japonaise, elle, est assurée en 1930 par K. Katayama, de Nishinomiya."},
 {q:"Combien de barmen ont participé au concours du Daily Mail du 1er mars 1937 ?", o:["160","600","1600","16 000"], r:2, e:"1600 participants, professionnels et amateurs. Le jury n'a retenu que 25 recettes."},
 {q:"Quelle particularité Vermeire revendique-t-il dans ce concours ?", o:["Il a remporté le premier prix","Il est le seul concurrent à avoir remporté deux prix","Il présidait le jury","Il a présenté cinq recettes"], r:1, e:"Son Lizzie's Own a décroché le 15e ET le 17e prix."},
 {q:"Le Lizzie's Own de Vermeire contient :", o:["1/2 Gordon's, 1/4 Courvoisier, 1/4 curaçao brun Fockink","1/3 armagnac, 1/3 calvados, 1/3 mandarine","1/2 rye, 1/4 vermouth italien, 1/4 vermouth français","1/3 gin, 1/3 cointreau, 1/3 citron"], r:0, e:"L'autre recette primée, le Rikiki, est celle à l'armagnac, au calvados du Bon Roy d'Yvetot et à la mandarine Candac."},
 {q:"Chez Vermeire, le « verre à sherry » a une forme :", o:["De tulipe","De coupe","De flûte","De tumbler"], r:2, e:"Le n°3, forme flûte, convient aussi aux apéritifs secs : vermouth, quinquina, amer. On le remplit aux deux tiers."},
 {q:"À quelle hauteur Vermeire recommande-t-il de remplir le verre à cocktail ?", o:["Aux deux tiers","À moitié","À un demi-centimètre du bord","Jusqu'au bord"], r:2, e:"Rempli seulement à moitié, il sert de verre à liqueur ou à pousse-café. Il insiste : ne jamais remplir jusqu'au bord."},
 {q:"Combien de verres par bouteille de champagne, selon la « bonne habitude » ?", o:["Quatre","Cinq","Six","Huit"], r:2, e:"Six verres par bouteille — et pour le champagne cocktail, on ne remplit le grand verre tulipe qu'à moitié."},
 {q:"Pour remuer, quelle glace Vermeire préconise-t-il ?", o:["De la glace pilée","De la glace en morceaux","Un seul gros bloc","Peu importe"], r:1, e:"En morceaux de préférence : la glace pilée fond trop vite."},
 {q:"L'absinthe « à la suissesse » se prépare avec :", o:["Un blanc d'œuf et une cuillerée d'anisette","Un jaune d'œuf et du sirop de sucre","De la grenadine","Du siphon uniquement"], r:0, e:"Au shaker, avec un verre d'absinthe, puis un long trait de siphon bien froid dans un verre à vin. Vermeire la conseille « le lendemain de la veille »."},
 {q:"Une « mominette », chez Vermeire, c'est :", o:["Une absinthe à la grenadine","Une absinthe française au sirop de sucre à la place du sucre","Une absinthe frappée","Une absinthe au blanc d'œuf"], r:1, e:"Avec de la grenadine, elle devient une « tomate » ou une « purée »."},
 {q:"Quel partenaire figure dans le cocktail « Handicap » de Vermeire ?", o:["Marie Brizard","Grand Marnier","Bénédictine","Campari"], r:1, e:"1/3 Grand-Marnier, 2/3 Fruchtschaumwein, une limonade gazeuse aux fruits très bue à Dresde."},
 {q:"Dans « Le Paradis du Zoute », recette de Vermeire, on trouve :", o:["De l'apry Marie Brizard","De la Bénédictine","Du Campari","Du Noilly Prat"], r:0, e:"1/3 jus d'orange frais, 1/3 apry Marie Brizard, 1/3 Gordon's dry gin."},
 {q:"Quel vermouth Vermeire utilise-t-il dans SON Dry Martini ?", o:["Cinzano","Martini","Noilly Prat","Chappaz"], r:2, e:"1 trait d'orange bitter, 2 traits de curaçao brun, 1/2 Gordon's, 1/2 Noilly Prat. Le Gloom Raiser en contient également."},
 {q:"Le « Robert's Special » a été créé par Vermeire à la suite :", o:["De la prohibition américaine","De la loi Vandervelde de 1919","De l'interdiction de l'absinthe","Du procès Martini-Rossi"], r:1, e:"Cette loi belge interdisait la vente en lieu public de tout spiritueux titrant plus de 18° — d'où un cocktail bâti sur sherry, vermouth et Dubonnet."},
 {q:"En quelle année Vermeire a-t-il introduit le Clover Club à Londres ?", o:["1910","1915","1920","1922"], r:1, e:"Au Royal Automobile Club, où il a aussi créé le Gloom Raiser et le Silver Streak la même année."},
 {q:"Le « Midnight » de Vermeire, c'est :", o:["Un Manhattan au sloe gin","Un Bronx avec un trait d'absinthe frappé ensemble","Un Bronx au jus de citron","Un Martini à l'oignon"], r:1, e:"Et le Minnehaha (« eau riante », servi à Shanghaï) est le même drink, mais l'absinthe est versée une fois le cocktail dans le verre."},
 {q:"Le « White Lady » de Vermeire est un Side-Car dans lequel :", o:["On remplace le cointreau par du curaçao","On remplace la fine par du dry gin","On ajoute un blanc d'œuf","On remplace le citron par du lime"], r:1, e:"Le Side-Car, cocktail populaire du midi de la France, a été introduit à Londres par MacGarry, du Buck's Club."},
 {q:"« Meehoulong » signifie :", o:["Eau riante","Diable qui mange le feu","Queue du coq","Fleur de minuit"], r:1, e:"C'est un mot chinois. À ne pas confondre avec Minnehaha, qui veut dire « eau riante »."},
 {q:"D'où vient le nom du cocktail « Ward Eight » ?", o:["D'un régiment britannique","Du 8e district de Boston","D'un bar de New York","Du 8e prix d'un concours"], r:1, e:"Boston compte huit districts. Le Soixante-Quinze, lui, tire son nom du canon de campagne de 14-18."},
 {q:"Selon Vermeire, l'Old Fashioned a la particularité :", o:["D'être toujours frappé au shaker","D'être préparé ET bu dans le même verre","De ne jamais contenir de sucre","D'être servi sans glace"], r:1, e:"Son nom « vieille mode » renvoie à l'époque où le shaker n'existait pas et la glace était difficile à obtenir."},
 {q:"Le cocktail « Bamboo » est aussi connu sous le nom de :", o:["York Cocktail","Reform Cocktail","East India","Japanese"], r:1, e:"Très populaire dans la colonie anglaise aux Indes. Le York Cocktail, lui, est le Thistle ; le Japanese est le Mikado."},
 {q:"Diki-Diki, qui donne son nom à un cocktail, était :", o:["Un barman de Manille","Le monarque de l'île d'Ubian, aux Philippines","Un boxeur américain","Un journaliste anglais"], r:1, e:"Il pesait 23 livres à trente-sept ans et mesurait 32 pouces ; mort en 1922."},
 {q:"Le cocktail « Princess Mary » de Harry McElhone célèbre :", o:["Un couronnement","Le mariage de la princesse Mary et de Lord Lascelles","La naissance d'une princesse","Un anniversaire royal"], r:1, e:"Février 1922. McElhone est aussi l'auteur du Monkey's Gland, créé au Ciro's de Londres en 1920."},
 {q:"Qui a créé le cocktail « Vanderbilt » et où ?", o:["Harry Craddock, au Savoy","« Guido », au Kursaal d'Ostende en 1912","Frank Meyer, au Ritz","Sid Knight, à l'Alhambra"], r:1, e:"À l'occasion de la visite du colonel Cornelius Vanderbilt, qui périra sur le Lusitania en mai 1915."},

 /* ===== COCKTAILS IMPOSÉS — ANNEXE #2 ===== */
 {q:"Quel est le seul cocktail imposé de la liste à contenir de l'absinthe ?", o:["Jasmine","Yellow Daisy","Tampico","Frisco Sour"], r:1, e:"Yellow Daisy : Roku, Noilly Prat dry, Grand Marnier et L'Entêté. C'est aussi le seul de la liste à contenir du Noilly Prat."},
 {q:"Le Frisco Sour associe le Wild Turkey à :", o:["Au Grand Marnier","À la Bénédictine","Au Campari","Au Boudier Triple sec"], r:1, e:"C'est le seul cocktail de la liste à utiliser la Bénédictine. Sucre optionnel, car la liqueur apporte déjà de la rondeur."},
 {q:"Quel cocktail imposé contient un float de vin rouge ?", o:["Harvard","Boulevardier","New York Sour","Planter's Punch"], r:2, e:"Le New York Sour : Wild Turkey, citron, sucre, puis le vin rouge versé délicatement sur le dos de la cuiller."},
 {q:"Le Harvard de la liste officielle associe :", o:["Merlet + Carpano + aromatic bitters","Wild Turkey + Carpano + Campari","Merlet + Noilly Prat + absinthe","Appleton + Carpano + bitters"], r:0, e:"Le seul cocktail imposé à base de cognac. Chez Vermeire : 2 traits d'angostura, 1 trait de sirop, 1/2 fine, 1/2 vermouth italien."},
 {q:"Quelle purée Ponthier entre dans le Mezcal Mule ?", o:["Figue de Barbarie","Framboise","Fruit de la Passion","Abricot"], r:2, e:"Avec le Nuestra Soledad Valles, le concombre en tranches, le citron vert et la ginger beer. Piment en poudre en option."},
 {q:"Le Mai Tai de la liste officielle remplace le curaçao par :", o:["Le Boudier Triple sec","Le Grand Marnier","Le Chinola","Le Kota"], r:1, e:"Appleton + Isautier + Grand Marnier + orgeat + citron vert : deux rhums partenaires dans un seul verre."},
 {q:"Quelle différence d'agrume sépare le Raspberry Mule du Mezcal Mule ?", o:["Aucune, les deux au citron vert","Le Raspberry Mule est au citron jaune, le Mezcal Mule au citron vert","L'inverse","Le Raspberry Mule est au pamplemousse"], r:1, e:"Raspberry Mule : Roku, Ponthier framboise, jus de CITRON, sucre, ginger beer. Mezcal Mule : citron VERT."},
 {q:"Quel cocktail imposé n'a PAS de gin alors qu'il contient du Campari et du triple sec ?", o:["Jasmine","Tampico","Boulevardier","Yellow Daisy"], r:1, e:"Le Tampico : Campari, Boudier Triple sec, jus de citron, tonic Fever-Tree. Le Jasmine, lui, contient du Roku."},
 {q:"Dans le Banana Daiquiri de la liste, quels rhums sont proposés ?", o:["Appleton uniquement","Isautier uniquement","Appleton et/ou Isautier","Appleton et Sab's"], r:2, e:"« et/ou » : les deux maisons peuvent être combinées. Avec la purée de banane Ponthier et du citron vert."},
 {q:"Quel mixer accompagne le Planter's Punch dans la liste officielle ?", o:["Ginger beer","Soda water","Tonic water","Ginger ale"], r:1, e:"Fever-Tree Soda water, comme dans le Gin Fizz. La ginger beer, elle, est réservée aux deux mules."},

 /* ===== FORMAT DE LA FINALE ===== */
 {q:"Quel est le coefficient de l'épreuve de mixologie ?", o:["2","3","4","5"], r:3, e:"Coefficient 5 : l'épreuve reine. Dégustation et rétro-assemblage sont à 3, le QCM à 2."},
 {q:"Combien de questions compte le QCM de la finale ?", o:["30","40","50","60"], r:2, e:"50 questions, coefficient 2, une seule bonne réponse possible par question."},
 {q:"Quelle part du QCM porte sur les marques partenaires ?", o:["20 %","30 %","50 %","70 %"], r:1, e:"30 % marques partenaires (d'après leurs sites officiels), 20 % extrait de livre, 50 % historiques et générales."},
 {q:"À la dégustation, que coûte une mauvaise réponse ?", o:["−1 point","−0,5 point","Aucun changement","L'annulation de l'épreuve"], r:2, e:"Bonne réponse : +1. Mauvaise réponse ou absence de réponse : aucun changement. Il faut donc toujours tenter."},
 {q:"Combien de temps pour le QCM et la dégustation réunis ?", o:["20 minutes","30 minutes","45 minutes","1 heure"], r:1, e:"30 minutes pour les deux, menées en même temps : le QCM et le plateau sont devant toi simultanément."},
 {q:"Combien de verres au total le jury reçoit-il en mixologie ?", o:["2","3","4","5"], r:1, e:"Création en 2 exemplaires (thèmes Local ou Technique) ou 4 (concept/miroir), plus l'imposé en 1 exemplaire — soit 3 verres pour le jury."},
 {q:"Quel est le temps de passage devant le jury en mixologie ?", o:["5 minutes","8 minutes","10 minutes","15 minutes"], r:1, e:"8 minutes, de la mise en place à la fin de l'élaboration. Pénalité au-delà ; arrêt total de toute manipulation à 10 minutes."},
 {q:"Que peut-on retirer de sa recette création avant la finale ?", o:["N'importe quel ingrédient","Tout ingrédient sauf un produit d'un fournisseur officiel","Rien du tout","Seulement la garniture"], r:1, e:"On peut ajouter un ingrédient, retirer un ingrédient sauf s'il vient d'un fournisseur officiel, faire évoluer la méthode et le service. À communiquer 10 jours avant."},
 {q:"Quelle quantité de pre-batch faut-il prévoir ?", o:["50 cl","1 litre","2 litres","5 litres"], r:1, e:"1 litre, préparé sur place le jour de la finale pour faire déguster au public. Prévoir les ingrédients maison en conséquence."},
 {q:"Le rétro-assemblage se déroule :", o:["Individuellement","Par binôme","Par équipe de 3","Par équipe de 4"], r:2, e:"Équipes de 3, tirées au sort en début de journée. 30 minutes pour retrouver les proportions à partir de 5 échantillons, et rendre la composition écrite plus un échantillon."},
 {q:"Quelle est la contenance du verre Rocks imposé ?", o:["220 ml","250 ml","295 ml","330 ml"], r:2, e:"Rocks 295 ml (h. 77 mm), Coupe 220 ml (h. 174 mm), Highball 330 ml (h. 146 mm)."},
 {q:"Quand a lieu le tirage au sort du cocktail imposé ?", o:["La veille","Au briefing du matin","Juste avant le passage du candidat","Une semaine avant"], r:2, e:"Juste avant le passage : les 13 recettes doivent être automatiques, verre et méthode compris."},
 {q:"Où se tient la finale 2026 ?", o:["Au Bastille Design Center, Paris 11e","Au Palais Brongniart","À la Maison de la Mutualité","Au Pavillon Cambon"], r:0, e:"74 boulevard Richard Lenoir, dimanche 13 septembre 2026. Métro Richard Lenoir (5) ou Saint-Ambroise (9)."},

 /* ===== LIVRE — COMPLÉMENTS ===== */
 {q:"Selon la préface, depuis quand les Aztèques vivaient-ils dans la vallée de Mexico ?", o:["1225","1325","1425","1520"], r:1, e:"Depuis 1325 ; ils dominèrent le pays jusqu'à l'arrivée des Espagnols en 1520."},
 {q:"Chez Vermeire, le « Jersey Lightning » désigne :", o:["Un whisky de seigle","L'Apple Jack Brandy","Un gin américain","Un rhum de la Jamaïque"], r:1, e:"L'Apple Jack Brandy, qui correspond au calvados en France."},
 {q:"Le cocktail Fioupe contient une cuillerée de :", o:["Chartreuse","Bénédictine","Marasquin","Cointreau"], r:1, e:"1 cuillerée à café de bénédictine, 1/2 fine, 1/2 cinzano. M. Fioupe était l'agent régional du vermouth Cinzano sur la côte d'Azur."},
 {q:"Le « Fil de fer Cocktail » s'obtient à partir du White en :", o:["Ajoutant l'anisette après avoir passé le cocktail dans le verre","Doublant la dose de gin","Remplaçant l'orange bitter par de l'angostura","Le frappant au shaker"], r:0, e:"Les 2 traits d'anisette versés dans le verre y forment des fils. Recette Harry Brecker, Mascotte Bar, Anvers, 1913."},
 {q:"Le Yellow Rattler est un Dry Martini avec :", o:["Un petit oignon entier","Des petits oignons hachés frappés en même temps","De la menthe fraîche","Une pelure d'orange"], r:1, e:"À ne pas confondre avec le Gibson, qui prend un petit oignon blanc entier. Comme le Cooperstown, c'est un drink de cowboys."},
 {q:"Le Glad Eye associe l'absinthe à :", o:["De la chartreuse jaune","De la pipermenthe Get","Du kummel","Du marasquin"], r:1, e:"1/3 de pipermenthe Get, 2/3 d'absinthe. C'est le cocktail de l'extrait le plus chargé en absinthe."},
 {q:"Le Silver Streak, créé par Vermeire en 1915, associe le dry gin à :", o:["Du marasquin","Du kummel","De la chartreuse","De l'anisette"], r:1, e:"Moitié kummel, moitié dry gin. Introduit au Royal Automobile Club de Londres, comme le Clover Club et le Gloom Raiser."},
 {q:"Dans la préface, quel proverbe anglais Vermeire cite-t-il sur la modération ?", o:["Never abuse a good thing","Drink less, drink better","Moderation in all things","Good things come to those who wait"], r:0, e:"« N'abusons pas des bonnes choses. » Il reconnaît que le cocktail est un stimulant qui agit comme un coup de fouet."},
 {q:"Le Spanish Delight se prépare avec un verre de :", o:["Sherry","Vermouth italien","Dubonnet","Fine"], r:1, e:"4 traits d'angostura et 1 verre de vermouth italien, avec l'essence de 3 ou 4 pelures de citron. À Madrid on remplace souvent le vermouth par du xérès solera."},
 {q:"Le cocktail Chocolat, au jaune d'œuf et à la chartreuse jaune, est connu :", o:["Au Brésil","En Suisse","Au Canada","En Belgique"], r:0, e:"Avec un jaune d'œuf, une cuillerée de poudre de chocolat sucré, 1/2 porto rouge et 1/2 chartreuse jaune."},
 {q:"Le Dempsey est une recette de « Guido » datée de :", o:["Ostende, 1912","Deauville-Monte Carlo, 1921","Londres, 1920","Paris, 1922"], r:1, e:"Attention au piège : c'est le VANDERBILT qui a été créé par Guido au Kursaal d'Ostende en 1912."},
 {q:"Le Bloodhound se prépare avec :", o:["6 belles framboises","6 feuilles de menthe","6 traits de grenadine","6 grains de café"], r:0, e:"Avec 1 cuillerée de marasquin et trois tiers de dry gin, vermouth français et vermouth italien."},
 {q:"Combien de traits d'absinthe dans le Blackthorn de Harry Johnson ?", o:["1","2","3","4"], r:2, e:"3 traits d'absinthe et 3 traits d'angostura, moitié vermouth français, moitié Irish whisky."},
 {q:"Le Ward Eight se compose de :", o:["Grenadine, jus d'orange, jus de citron, rye whisky","Grenadine, jus de citron, gin","Curaçao, orange, scotch","Sirop de gomme, citron, bourbon"], r:0, e:"1 cuillerée de grenadine, 1/4 jus d'orange, 1/4 jus de citron, 1/2 rye whisky. Boston compte huit districts."},
 {q:"Le Soixante-Quinze de Vermeire contient :", o:["Du champagne","Du calvados et du dry gin","Du cognac et du citron","Du rhum et de la grenadine"], r:1, e:"2 traits de grenadine, 1 cuillerée de jus de citron, 1/3 calvados, 2/3 dry gin. Très populaire au Henry's Bar de Paris pendant la guerre de 14-18."},
 {q:"La recette du Manhattan de la Gilde des barmen d'Angleterre se distingue par :", o:["L'absence de bitter et de sirop ou curaçao","L'emploi du shaker","L'ajout d'absinthe","L'usage du bourbon"], r:0, e:"Même composition que celle de Vermeire, mais sans bitter ni sirop. Vermeire, lui, met 1 ou 2 traits d'angostura et 2 ou 3 traits de sirop ou curaçao."},
 {q:"Le Manhattan de Vermeire, en version demi-sec, se compose de :", o:["1/2 rye, 1/2 vermouth français","1/2 rye, 1/4 vermouth italien, 1/4 vermouth français","1/2 rye, 1/2 vermouth italien","1/3 rye, 2/3 vermouth italien"], r:1, e:"Sec = 1/2 rye + 1/2 vermouth français ; doux = 1/2 rye + 1/2 vermouth italien."},
 {q:"Le Turf de Harry Johnson se sert :", o:["Avec une pelure de citron pressée","Avec une pelure d'orange pressée","Avec une olive, sans presser aucune pelure","Avec une cerise"], r:2, e:"Vermeire précise explicitement : ne presser ni pelure de citron ni pelure d'orange dessus. 2 traits d'orange bitter, 2 de marasquin, 2 d'absinthe."},
 {q:"Dans le nécessaire de Vermeire, combien de flacons stilligouttes ?", o:["2 à 3","4 à 6","8 à 10","Un seul"], r:1, e:"Quatre à six, pour les bitters, l'absinthe et les sirops. La liste complète compte 13 objets."},
 {q:"Quel shaker Vermeire juge-t-il « très peu pratique » ?", o:["Le shaker deux timbales en argent","Le shaker d'une timbale avec couvercle contenant la passoire","Le shaker en verre","Le shaker à trois pièces en étain"], r:1, e:"Il préfère nettement les deux timbales en argent qui s'adaptent l'une dans l'autre."},

 /* ===== HISTOIRE DES IMPOSÉS ===== */
 {q:"Le Boulevardier apparaît pour la première fois dans :", o:["The Savoy Cocktail Book, 1930","Barflies and Cocktails, 1927","Modern American Drinks, 1895","The Fine Art of Mixing Drinks, 1948"], r:1, e:"Le livre de Harry McElhone, dans la section « Cocktails Round Town » d'Arthur Moss, attribué à Erskine Gwynne."},
 {q:"Erskine Gwynne, à qui l'on doit le Boulevardier, était :", o:["Un barman écossais","Un Américain expatrié à Paris, fondateur d'un magazine","Un comte florentin","Un journaliste anglais"], r:1, e:"Apparenté aux Vanderbilt, il lança en 1927 le magazine parisien Boulevardier, paru jusqu'en 1932."},
 {q:"Où le Mai Tai a-t-il été créé ?", o:["À Honolulu","À Oakland, en Californie","À Tahiti","À La Havane"], r:1, e:"Chez Trader Vic (Victor Jules Bergeron), en 1944. Le lien avec Hawaï est une idée reçue."},
 {q:"« Maita'i roa a'e », l'exclamation à l'origine du Mai Tai, signifie :", o:["À la vôtre","Hors de ce monde","Le meilleur des rhums","Bienvenue chez nous"], r:1, e:"Prononcée par Carrie Guild, amie tahitienne de Trader Vic, en goûtant le drink en 1944."},
 {q:"Le Jasmine a été créé en 1993 par :", o:["Harry Craddock","Paul Harrington","Dale DeGroff","Audrey Saunders"], r:1, e:"Au Townhouse Bar & Grill d'Emeryville, en Californie, à partir du Pegu Club."},
 {q:"Le Jasmine dérive de quel cocktail ?", o:["Du Negroni","Du Pegu Club","Du White Lady","Du Bronx"], r:1, e:"Harrington a remplacé l'angostura du Pegu Club par du Campari, et le citron vert par du citron jaune."},
 {q:"Le Tampico a été créé :", o:["Au Mexique dans les années 1930","À Paris, hôtel George V, années 1960","À Milan chez Campari","À Londres au Savoy"], r:1, e:"Attribué à Rudolf Slavik, barman de l'hôtel George V. C'est une création française — un argument à placer devant le jury."},
 {q:"Le New York Sour est né :", o:["À New York dans les années 1900","À Chicago dans les années 1880","À Boston avant la prohibition","À La Nouvelle-Orléans en 1888"], r:1, e:"Les barmen de Chicago finissaient un whiskey sour d'un « claret snap », un filet de vin rouge flotté."},
 {q:"Lequel de ces noms N'A PAS désigné le New York Sour ?", o:["Continental Sour","Claret Snap","Brunswick Sour","Boston Sour"], r:3, e:"Il a porté les noms de Continental Sour, Southern Whiskey Sour, Claret Snap et Brunswick Sour."},
 {q:"Le Harvard apparaît pour la première fois dans :", o:["Modern American Drinks de George J. Kappeler, 1895","Le Savoy Cocktail Book, 1930","L'Art du Cocktail de Vermeire","Barflies and Cocktails, 1927"], r:0, e:"Parts égales brandy et vermouth italien, sirop de gomme, angostura, allongé au seltz. Vermeire le reprendra sans seltz."},
 {q:"Quelle différence entre le Harvard de Kappeler (1895) et celui de Vermeire ?", o:["Kappeler l'allonge au seltz, pas Vermeire","Vermeire utilise du whisky","Kappeler n'y met pas de bitter","Vermeire le fait au shaker"], r:0, e:"Kappeler termine au seltz ; Vermeire donne 2 traits d'angostura, 1 trait de sirop, 1/2 fine, 1/2 vermouth italien, remué, sans eau gazeuse."},
 {q:"Le Yellow Daisy est publié en 1930 dans :", o:["Le Savoy Cocktail Book de Harry Craddock","Le Bar-Tender's Guide de Jerry Thomas","Barflies and Cocktails","Modern American Drinks"], r:0, e:"Avec une note l'attribuant à Richard William « Deadwood Dick » Clark, figure du Far West."},
 {q:"Malgré son nom, le Yellow Daisy appartient à la famille :", o:["Des Daisy","Des Martini","Des Sour","Des Fizz"], r:1, e:"C'est un Martini sucré et aromatisé, pas un Daisy. Un piège classique."},
 {q:"À l'origine, le « Frisco » se composait de :", o:["Whisky, Bénédictine et citron","Whisky et Bénédictine seulement","Whisky, Chartreuse et citron","Cognac et Bénédictine"], r:1, e:"Sans citron, remué. Chez Boothby (1934), Beebe (1946) et Embury (1948). Le citron en fait un sour."},
 {q:"La formule classique du punch se récite :", o:["One of sour, two of sweet, three of strong, four of weak","Two of sour, two of sweet, one of strong","Three of sour, one of sweet, two of strong","One of each, four times"], r:0, e:"Un d'acide, deux de sucre, trois d'alcool, quatre d'eau. Le punch est l'ancêtre du bar : première recette publiée en Inde en 1638."},
 {q:"Le Moscow Mule, matrice des deux mules de la liste, date de :", o:["1931","1941","1951","1961"], r:1, e:"Deux récits concurrents, tous deux datés de 1941 : Los Angeles (John Martin de Smirnoff et Jack Morgan du Cock'n'Bull) et New York (Chatham Hotel)."},
 {q:"Qui produisait la ginger beer à l'origine du Moscow Mule ?", o:["Schweppes","Le Cock'n'Bull de Jack Morgan","Fever-Tree","Canada Dry"], r:1, e:"Jack Morgan tenait le Cock'n'Bull à Hollywood et cherchait à écouler sa ginger beer ; John Martin, lui, voulait vendre de la vodka Smirnoff."},
 {q:"La famille des Fizz est codifiée en 1876 par :", o:["Jerry Thomas","Harry Johnson","Harry Craddock","Robert Vermeire"], r:0, e:"Dans la 2e édition de son Bar-Tender's Guide. Le sommet de la famille est le Ramos Gin Fizz (La Nouvelle-Orléans, 1888)."},
 {q:"Le Ramos Gin Fizz a été créé en 1888 à :", o:["New York","La Nouvelle-Orléans","San Francisco","Chicago"], r:1, e:"Par Henry C. Ramos, réputé pour un shake de douze minutes."},
 {q:"« Daiquiri » est le nom :", o:["D'un village de pêcheurs à Porto Rico","D'une mine de fer près de Santiago de Cuba","D'un cépage cubain","Du bateau de Jennings Cox"], r:1, e:"Vermeire le mentionne dans le livre au programme : un pont direct entre les deux annexes. Paternité attribuée à l'ingénieur Jennings Cox, vers 1898."},
 {q:"Quel imposé de la liste est le plus récent ?", o:["Le Mai Tai","Le Tampico","Le Jasmine","Le Boulevardier"], r:2, e:"Jasmine, 1993. Le Tampico date des années 1960, le Mai Tai de 1944, le Boulevardier de 1927."},
 {q:"Combien des 13 imposés ont une base Roku Gin ?", o:["Deux","Trois","Quatre","Cinq"], r:2, e:"Gin Fizz, Raspberry Mule, Yellow Daisy et Jasmine. Wild Turkey et Appleton en comptent trois chacun."},

 /* ===== CULTURE GÉNÉRALE DU BAR ===== */
 {q:"Le premier livre de cocktails publié dans l'histoire est :", o:["Le Savoy Cocktail Book, 1930","How to Mix Drinks de Jerry Thomas, 1862","Le Bartender's Manual de Harry Johnson, 1882","L'Art du Cocktail de Vermeire"], r:1, e:"Jerry Thomas, dit « le Professeur », publie « How to Mix Drinks, or The Bon-Vivant's Companion » aux États-Unis en 1862."},
 {q:"Quel cocktail spectaculaire est associé à Jerry Thomas ?", o:["Le Blue Blazer","Le Ramos Gin Fizz","Le Hanky Panky","Le Sazerac"], r:0, e:"Un jet de whisky enflammé transvasé d'une timbale à l'autre."},
 {q:"L'apport principal du manuel de Harry Johnson (1882) est :", o:["Les premières recettes tiki","La gestion et l'organisation d'un bar","La classification IBA","La distillation des liqueurs"], r:1, e:"C'est le premier ouvrage à traiter la tenue d'un établissement, pas seulement les recettes."},
 {q:"La Prohibition américaine a duré :", o:["De 1917 à 1930","De 1920 à 1933","De 1919 à 1929","De 1923 à 1935"], r:1, e:"Le 18e amendement entre en vigueur le 17 janvier 1920 ; abrogation le 5 décembre 1933 par le 21e amendement. Le Volstead Act datait de 1919."},
 {q:"Quelle conséquence majeure la Prohibition a-t-elle eue sur le bar européen ?", o:["La fermeture des bars d'hôtel","L'exil des barmen américains vers Londres, Paris et Cuba","L'interdiction du vermouth en France","La création de l'IBA"], r:1, e:"C'est ce qui produit l'âge d'or des bars européens des années 20 : McElhone à Paris, Craddock au Savoy."},
 {q:"Harry's New York Bar a ouvert à Paris en :", o:["1898","1911","1923","1927"], r:1, e:"Rue Daunou, à l'initiative du jockey Tod Sloan. Harry MacElhone en devient propriétaire en 1923."},
 {q:"Ada Coleman, head barmaid du Savoy, a créé :", o:["Le Hanky Panky","Le White Lady","Le Sidecar","Le Bramble"], r:0, e:"Pour l'acteur Charles Hawtrey. Elle a tenu l'American Bar du Savoy de 1903 à 1926."},
 {q:"Le Savoy Cocktail Book (1930) est signé :", o:["Ada Coleman","Harry Craddock","Harry McElhone","Frank Meier"], r:1, e:"Craddock, exilé par la Prohibition. C'est là que figure le Yellow Daisy, l'un des 13 imposés."},
 {q:"Qui est considéré comme le père du tiki ?", o:["Trader Vic","Donn Beach","Jerry Thomas","Constante Ribalaigua"], r:1, e:"Ernest Gantt, dit Donn Beach, ouvre Don the Beachcomber à Hollywood au début des années 1930. Trader Vic suit à Oakland."},
 {q:"L'Espresso Martini est attribué à :", o:["Dale DeGroff","Dick Bradsell","Salvatore Calabrese","Audrey Saunders"], r:1, e:"Barman londonien des années 1980, également auteur du Bramble (vers 1984, au Fred's Club)."},
 {q:"L'IBA a été fondée en :", o:["1931 à Paris","1951 à Torquay","1961 à Milan","1947 à Londres"], r:1, e:"Le 24 février 1951, dans le saloon du Grand Hotel de Torquay, par sept associations nationales."},
 {q:"L'Association des Barmen de France est, vis-à-vis de l'IBA :", o:["Un membre fondateur","Un membre observateur","Une association non affiliée","Un membre depuis 1961"], r:0, e:"La France fait partie des sept fondateurs, avec l'Angleterre, le Danemark, l'Italie, les Pays-Bas, la Suède et la Suisse."},
 {q:"En quelle année paraît la première liste officielle de cocktails IBA ?", o:["1951","1955","1961","1971"], r:2, e:"L'idée est lancée par Angelo Zola au congrès de Paris en 1960 ; la liste paraît en 1961. Le premier concours international avait eu lieu à Amsterdam en 1955."},
 {q:"Dans quelle unité l'IBA exprime-t-elle ses recettes ?", o:["En millilitres","En centilitres","En onces","En parts"], r:1, e:"En centilitres, contrairement à l'usage courant en millilitres."},
 {q:"Dans l'UE, une liqueur doit contenir au minimum :", o:["50 g de sucre par litre","100 g de sucre par litre","150 g de sucre par litre","250 g de sucre par litre"], r:1, e:"Et au moins 15 % vol. Exceptions : cerise 70 g/L, gentiane 80 g/L. C'est le socle de l'argument « extra-dry » d'Algebra."},
 {q:"Une « crème de cassis » doit contenir au minimum :", o:["100 g/L de sucre","250 g/L","400 g/L","600 g/L"], r:2, e:"400 g/L pour la crème de cassis, contre 250 g/L pour les autres « crème de ». Gabriel Boudier en est une référence mondiale."},
 {q:"Le vieillissement minimum d'un whisky dans l'UE est de :", o:["Un an","Deux ans","Trois ans","Cinq ans"], r:2, e:"Trois ans en fûts de bois de 700 litres maximum, minimum 40 % vol, distillation à moins de 94,8 % vol."},
 {q:"Le degré minimum d'un gin dans l'UE est de :", o:["32 %","37,5 %","40 %","43 %"], r:1, e:"Et le goût de genièvre (Juniperus communis) doit être dominant. Le Roku titre 43 %."},
 {q:"Qu'est-ce qui caractérise un « London gin » ?", o:["Il est produit à Londres","Il est aromatisé uniquement par redistillation, sans colorant ni quasi sucre","Il titre au moins 45 %","Il contient au moins dix botaniques"], r:1, e:"« London » ne désigne PAS un lieu de production : c'est la catégorie la plus stricte du règlement."},
 {q:"Le sucrage maximum d'un rhum dans l'UE est de :", o:["0 g/L","10 g/L","20 g/L","50 g/L"], r:2, e:"20 g/L — mais un rhum revendiquant la mention « traditionnel » ne peut pas être édulcoré du tout."},
 {q:"Depuis 2018, un cognac XO doit avoir au minimum :", o:["4 ans","6 ans","10 ans","14 ans"], r:2, e:"Le seuil est passé de 6 à 10 ans en 2018. La catégorie XXO, créée la même année, exige 14 ans."},
 {q:"Un cognac VSOP doit avoir au minimum :", o:["2 ans","4 ans","6 ans","8 ans"], r:1, e:"VS : 2 ans · VSOP : 4 ans · Napoléon : 6 ans · XO : 10 ans · XXO : 14 ans. Toujours l'âge de la plus jeune eau-de-vie."},
 {q:"Combien de crus compte l'appellation cognac ?", o:["Quatre","Cinq","Six","Sept"], r:2, e:"Grande Champagne, Petite Champagne, Borderies, Fins Bois, Bons Bois, Bois Ordinaires."},
 {q:"La « Fine Champagne » désigne :", o:["Un cognac de Grande Champagne pur","Un assemblage de Grande et Petite Champagne avec au moins 50 % de Grande","Un cognac vieilli en fût de champagne","Un cognac de Borderies"], r:1, e:"Une mention d'assemblage, souvent confondue avec un cru à part entière."},
 {q:"Quelle différence de distillation entre cognac et armagnac ?", o:["Le cognac est distillé en continu, l'armagnac en deux passes","Le cognac est doublement distillé en alambic charentais, l'armagnac en colonne continue à bas degré","Les deux utilisent la colonne","Les deux utilisent le pot still"], r:1, e:"L'armagnac sort vers 58 % : plus de matière aromatique conservée. Trois zones : Bas-Armagnac, Ténarèze, Haut-Armagnac."},
 {q:"Une tequila Reposado vieillit :", o:["Moins de 2 mois","De 2 mois à 1 an","De 1 à 3 ans","Plus de 3 ans"], r:1, e:"Blanco : non vieilli · Reposado : 2 mois à 1 an · Añejo : 1 à 3 ans · Extra Añejo : plus de 3 ans. Calle 23 : Repo 8 mois, Añejo 16 mois."},
 {q:"Une tequila « mixto » contient au minimum :", o:["51 % d'agave","70 % d'agave","80 % d'agave","100 % d'agave"], r:0, e:"Le reste peut venir d'autres sucres. Calle 23 est 100 % agave bleu Weber."},
 {q:"Le vermouth est légalement :", o:["Un spiritueux","Un vin aromatisé","Une liqueur","Un amer"], r:1, e:"Au moins 75 % de vin, entre 14,5 et 22 % vol, et l'aromatisation doit faire intervenir de l'armoise (Wermut en allemand, d'où le nom)."},
 {q:"Quelle est la différence entre un Sour et un Fizz ?", o:["Le Fizz est allongé d'eau gazeuse","Le Sour contient toujours un œuf","Le Fizz se fait au verre à mélange","Le Sour se sert sur glace"], r:0, e:"Même base — spiritueux, acide, sucre. Le Fizz est allongé au soda après passage au verre ; le Collins, lui, est construit directement au verre sur glace."},
 {q:"Le « dry shake » consiste à :", o:["Frapper sans glace pour émulsionner","Frapper très brièvement","Frapper sans sucre","Frapper avec de la glace pilée"], r:0, e:"Typiquement pour un blanc d'œuf. Le « reverse dry shake » inverse l'ordre : avec glace d'abord, sans glace ensuite."},
 {q:"Le « throwing » est une technique qui consiste à :", o:["Jeter les glaçons avant de servir","Transvaser en hauteur d'une timbale à l'autre","Lancer le shaker","Filtrer deux fois"], r:1, e:"On aère et on refroidit sans la dilution ni la texture du shake. Très utilisé pour les drinks au sherry ou au vermouth."},
 {q:"Le « swizzle » se pratique avec :", o:["Une cuiller de bar","Un bâton lélé sur glace pilée","Un pilon","Un fouet"], r:1, e:"Le bois lélé des Antilles, à branches, roulé entre les paumes dans la glace pilée jusqu'à givrage du verre."},
 {q:"Quelle passoire s'utilise sur un verre à mélange ?", o:["La hawthorne","La julep","Le chinois fin","La passoire conique"], r:1, e:"La hawthorne, à ressort, se pose sur le shaker ; le chinois fin sert au double filtrage."},
 {q:"Un shaker cobbler se compose de :", o:["Deux parties","Trois parties, avec passoire intégrée","Une timbale et un verre","Quatre parties"], r:1, e:"C'est celui que Vermeire jugeait « très peu pratique ». Le Boston en compte deux, le parisien aussi."},
 {q:"La « part des anges » désigne :", o:["Le fond de fût non embouteillé","La fraction évaporée pendant le vieillissement","La part du maître de chai","Le premier soutirage"], r:1, e:"0,5 à 3 % par an selon le climat. En zone tropicale elle explose : le vieillissement d'Appleton est environ trois fois plus rapide qu'en Écosse."},
 {q:"Dans une distillation, on écarte :", o:["Les têtes et les queues","Uniquement les têtes","Uniquement les queues","Le cœur"], r:0, e:"Les têtes sont volatiles et toxiques, les queues lourdes et grasses. On ne garde que le cœur de chauffe."},
 {q:"Le système « solera y criaderas » consiste à :", o:["Vieillir en fût unique scellé","Ne jamais vider un fût entièrement, le jeune nourrissant le vieux","Mélanger des millésimes annuels","Vieillir au soleil"], r:1, e:"Système andalou par étages, qui stabilise la moyenne d'âge. Les soleras de La Ina remontent à 1918-1919."},
 {q:"Le sirop de gomme se distingue du sirop simple par :", o:["Son taux de sucre","L'ajout de gomme arabique, qui apporte de la texture","Sa cuisson","Sa couleur"], r:1, e:"C'est le sucrant des cocktails du XIXe, omniprésent dans le livre de Vermeire."},
 {q:"L'orgeat est un sirop à base de :", o:["Orge","Amande","Orgeat de canne","Fleur d'oranger seule"], r:1, e:"Sirop d'amande, souvent parfumé à la fleur d'oranger. Indispensable au Mai Tai — malgré son nom qui évoque l'orge."},
 {q:"Le Milano-Torino associe :", o:["Campari et vermouth rouge","Campari et soda","Gin et Campari","Vermouth et prosecco"], r:0, e:"Milan pour le Campari, Turin pour le vermouth. Avec du soda il devient l'Americano ; avec du gin, le Negroni ; avec du bourbon, le Boulevardier."},
 {q:"Le Sazerac était à l'origine préparé avec :", o:["Du rye whiskey","Du cognac","Du bourbon","Du rhum"], r:1, e:"Du cognac Sazerac-de-Forge. Le passage au rye s'explique par la raréfaction du cognac après le phylloxéra."},
 {q:"Quelle crise a fait basculer les cocktails du cognac vers le whisky ?", o:["La Prohibition","Le phylloxéra","La Première Guerre mondiale","L'interdiction de l'absinthe"], r:1, e:"Le puceron ravage le vignoble européen à partir des années 1860-1870 : le cognac se raréfie, le whisky et le gin prennent sa place."},
 {q:"L'absinthe a été interdite en France en :", o:["1906","1910","1915","1922"], r:2, e:"Après la Belgique (1906), la Suisse (1910) et les États-Unis (1912). La mention « absinthe » redevient légale en France en 2011."},
 {q:"Le « louche » de l'absinthe s'explique par :", o:["La chlorophylle","La précipitation des huiles essentielles d'anis quand le degré baisse","La thuyone","Le sucre"], r:1, e:"Solubles dans l'alcool, elles ne le sont plus dans l'eau : d'où le trouble laiteux."},
 {q:"Le Vieux Carré et le Singapore Sling ont en commun :", o:["La Bénédictine","Le cognac","Le gin","Le vermouth français"], r:0, e:"Vieux Carré : Hôtel Monteleone, La Nouvelle-Orléans, 1938. Singapore Sling : Raffles Hotel, vers 1915."},
 {q:"Une liqueur de cerise peut, dans l'UE, descendre à :", o:["50 g/L de sucre","70 g/L","80 g/L","100 g/L"], r:1, e:"70 g/L pour la cerise et 80 g/L pour la gentiane : les deux seules exceptions au minimum de 100 g/L."},

 /* ===== CRÉATEURS & MODERN CLASSICS ===== */
 {cat:"Créateurs & modern classics", q:"Qui a inventé le Breakfast Martini ?", o:["Dick Bradsell","Salvatore Calabrese","Dale DeGroff","Peter Dorelli"], r:1, e:"En 1996, au Library Bar du Lanesborough à Londres. L'idée lui vient d'une tartine de marmelade d'orange que sa femme Susan l'oblige à manger au petit-déjeuner. C'est un White Lady à la marmelade."},
 {cat:"Créateurs & modern classics", q:"Dans quel bar le Breakfast Martini a-t-il été créé ?", o:["Le Dukes Bar","Le Library Bar du Lanesborough","Le American Bar du Savoy","Le Connaught Bar"], r:1, e:"Hôtel du quartier de Belgravia, à deux pas de Buckingham Palace. Calabrese est surnommé « The Maestro »."},
 {cat:"Créateurs & modern classics", q:"Quel ingrédient signe le Breakfast Martini ?", o:["Du miel","De la marmelade d'orange","De la confiture d'abricot","Du sirop de pain grillé"], r:1, e:"Une cuillère de marmelade, avec gin, Cointreau et jus de citron. Craddock donnait déjà un « Marmalade Cocktail » très proche dans le Savoy Cocktail Book de 1930."},
 {cat:"Créateurs & modern classics", q:"Qui a créé le Penicillin, et où ?", o:["Sam Ross, au Milk & Honey de New York","Dick Bradsell, au Fred's Club de Londres","Audrey Saunders, au Pegu Club","Phil Ward, au Death & Co"], r:0, e:"En 2005. Un Gold Rush dont il change le sucrant (miel + gingembre) et la base (blended scotch), avec un float de scotch tourbé d'Islay. Ross est australien, arrivé à New York en 2004."},
 {cat:"Créateurs & modern classics", q:"Le Paper Plane a été créé par :", o:["Joaquín Simó, au Death & Co","Sam Ross, au Violet Hour de Chicago","Giuseppe Gonzalez, au Clover Club","Vincenzo Errico, au Milk & Honey"], r:1, e:"En 2007, à parts égales : bourbon, Aperol, Amaro Nonino, citron. Nommé d'après le morceau de M.I.A. sorti la même année. Ross utilisait du Campari au départ, remplacé ensuite par l'Aperol."},
 {cat:"Créateurs & modern classics", q:"Le Naked and Famous est une variation sur :", o:["Le Last Word","Le Paper Plane","Le Penicillin","Le Bramble"], r:1, e:"Joaquín Simó, Death & Co, New York, 2011 : mezcal, Chartreuse jaune, Aperol, citron vert, à parts égales — le Paper Plane transposé à l'agave."},
 {cat:"Créateurs & modern classics", q:"Qui a créé l'Oaxaca Old-Fashioned ?", o:["Phil Ward, au Death & Co","Sam Ross, au Milk & Honey","Julio Bermejo","Joaquín Simó"], r:0, e:"New York, 2007. Tequila et mezcal, agave, bitters — l'un des drinks qui a lancé l'agave dans la mixologie américaine."},
 {cat:"Créateurs & modern classics", q:"L'Old Cuban est une création de :", o:["Audrey Saunders","Ada Coleman","Julie Reiner","Dale DeGroff"], r:0, e:"Au Beacon puis Tonic, New York, 2001. Rhum vieux, menthe, citron vert, angostura et champagne : un mojito habillé en cocktail de luxe. Saunders a aussi créé le Gin-Gin Mule."},
 {cat:"Créateurs & modern classics", q:"Le Porn Star Martini a été créé par :", o:["Douglas Ankrah, au Townhouse de Londres","Salvatore Calabrese","Dick Bradsell","Tony Conigliaro"], r:0, e:"En 2001. Vodka vanille, fruit de la passion, avec un shot de champagne à côté. Ankrah l'avait d'abord appelé « Maverick Martini ». À rapprocher de la Chinola Passion Fruit du concours."},
 {cat:"Créateurs & modern classics", q:"Tommy's Margarita remplace le triple sec par :", o:["Du sirop de sucre","Du sirop d'agave","Du miel","Du Cointreau blanc"], r:1, e:"Julio Bermejo, au Tommy's Mexican Restaurant de San Francisco, début des années 90. Il supprime la liqueur d'orange pour laisser parler l'agave — et impose le 100 % agave dans son bar."},
 {cat:"Créateurs & modern classics", q:"Le Cosmopolitan moderne est généralement attribué à :", o:["Toby Cecchini, à l'Odeon de New York","Dale DeGroff, au Rainbow Room","Cheryl Cook, en Floride","Sam Ross"], r:0, e:"Fin des années 1980. Cecchini part d'une version antérieure et la reformule avec vodka citron, Cointreau, cranberry et citron vert frais. Sa popularité mondiale vient de Sex and the City."},
 {cat:"Créateurs & modern classics", q:"Le Red Hook, twist de Manhattan au Punt e Mes, a été créé par :", o:["Vincenzo Errico, au Milk & Honey","Sam Ross","Michael McIlroy","Phil Ward"], r:0, e:"New York, 2003. Rye, Punt e Mes et marasquin. Nommé d'après le quartier de Brooklyn — il a ouvert toute une famille de twists baptisés d'après des quartiers new-yorkais."},
 {cat:"Créateurs & modern classics", q:"Le Trinidad Sour se distingue par :", o:["Une dose massive d'angostura comme base","Un float de rhum overproof","Une clarification au lait","Un sirop de tabac"], r:0, e:"Giuseppe Gonzalez, Clover Club, Brooklyn, 2008 : environ 45 ml d'angostura, avec orgeat, rye et citron. Le bitter n'est plus un assaisonnement mais l'ingrédient principal."},
 {cat:"Créateurs & modern classics", q:"Le Gin Basil Smash a été créé par :", o:["Jörg Meyer, à Hambourg","Dick Bradsell, à Londres","Simone Caporale","Ago Perrone"], r:0, e:"Au Le Lion de Hambourg, 2008. Gin, basilic frais, citron, sucre — un smash dont l'herbe devient le sujet."},
 {cat:"Créateurs & modern classics", q:"Dick Bradsell a créé le Bramble :", o:["Au Fred's Club de Londres, vers 1984","Au Savoy, en 1990","Au Match Bar, en 1996","Au Soho Brasserie, en 1979"], r:0, e:"Gin, citron, sucre, crème de mûre versée en cascade sur la glace pilée. Bradsell est aussi l'auteur de l'Espresso Martini, né au Soho Brasserie dans les années 80 sous le nom de Vodka Espresso."},
 {cat:"Créateurs & modern classics", q:"À l'origine, l'Espresso Martini s'appelait :", o:["Coffee Martini","Vodka Espresso","Black Russian Royale","Café Bradsell"], r:1, e:"Dick Bradsell, Soho Brasserie, Londres, années 1980. Le nom Espresso Martini est venu plus tard, à l'époque où tout ce qui se servait en verre à martini prenait ce nom."},
 {cat:"Créateurs & modern classics", q:"Dale DeGroff, figure du renouveau américain, officiait :", o:["Au Rainbow Room de New York","Au Milk & Honey","Au Pegu Club","Au Death & Co"], r:0, e:"À partir de 1987, sous l'impulsion de Joe Baum. Surnommé « King Cocktail », il remet les jus frais et les recettes historiques au centre — le point de départ de la renaissance américaine."},
 {cat:"Créateurs & modern classics", q:"Le Milk & Honey de New York a été fondé par :", o:["Sasha Petraske","Sam Ross","Audrey Saunders","Julie Reiner"], r:0, e:"En 1999, sur Eldridge Street. Le modèle du néo-speakeasy : porte sans enseigne, règles de tenue, service sur réservation. C'est là que naissent le Penicillin, le Red Hook et toute une génération de barmen."},

 /* ===== HISTOIRE DU BAR — APPROFONDISSEMENT ===== */
 {cat:"Histoire du bar", q:"Le mot « cocktail » apparaît pour la première fois par écrit avec une définition en :", o:["1798","1806","1822","1862"], r:1, e:"Le 13 mai 1806, dans The Balance and Columbian Repository (Hudson, New York), sous la plume de l'éditeur Harry Croswell, en réponse à un lecteur : « une liqueur stimulante composée de spiritueux de toute sorte, de sucre, d'eau et de bitters », qu'il dit vulgairement appelée « bittered sling ». Le mot était déjà imprimé avant — 1803 dans The Farmer's Cabinet — mais sans définition. Le 13 mai est devenu le World Cocktail Day."},
 {cat:"Histoire du bar", q:"Selon la définition de 1806, un cocktail comporte quatre éléments :", o:["Spiritueux, sucre, eau, bitters","Spiritueux, jus, sucre, glace","Spiritueux, vermouth, bitters, zeste","Spiritueux, liqueur, acide, sucre"], r:0, e:"C'est la définition de l'Old Fashioned. Tout le reste de la mixologie en découle par ajout ou substitution."},
 {cat:"Histoire du bar", q:"Le Sazerac doit son nom :", o:["À un barman de La Nouvelle-Orléans","À la marque de cognac Sazerac-de-Forge","À une rue du quartier français","Au premier pharmacien de Louisiane"], r:1, e:"Le cognac de la maison Sazerac-de-Forge et fils. Après le phylloxéra, le rye le remplace. Le bitter Peychaud's vient de l'apothicaire Antoine Amédée Peychaud."},
 {cat:"Histoire du bar", q:"Le mot « cocktail » et le coquetier de Peychaud : quelle est cette hypothèse ?", o:["Le coquetier servait à doser les bitters, et sa déformation aurait donné « cocktail »","Peychaud élevait des coqs","Il vendait des œufs de coq","Le coquetier était le surnom de son bar"], r:0, e:"L'apothicaire Peychaud aurait servi ses toniques dans un coquetier ; le mot, mal prononcé par les Anglophones, aurait donné « cocktail ». Une hypothèse séduisante, mais aucune source ne la confirme : à présenter comme légende."},
 {cat:"Histoire du bar", q:"Jerry Thomas a exercé notamment :", o:["À l'Occidental Hotel de San Francisco et au Metropolitan de New York","Uniquement à Londres","Au Savoy","À La Havane"], r:0, e:"Il a aussi parcouru l'Europe avec ses propres outils en argent. Son surnom : « le Professeur ». Son Blue Blazer, jet de whisky enflammé, est son numéro le plus célèbre."},
 {cat:"Histoire du bar", q:"Le Manhattan serait né, selon la légende la plus répandue :", o:["Au Manhattan Club de New York","Au Waldorf Astoria","Au Delmonico's","Au Hoffman House"], r:0, e:"Dans les années 1870, lors d'un banquet que la légende attribue à Jennie Jerome, mère de Winston Churchill — chronologiquement impossible, elle était alors en Angleterre. À raconter comme légende."},
 {cat:"Histoire du bar", q:"Le Daiquiri est attribué à :", o:["Jennings Cox, ingénieur américain à Cuba","Constante Ribalaigua","Emilio González","Facundo Bacardí"], r:0, e:"Vers 1898, près de la mine de fer de Daiquirí. C'est Constante Ribalaigua, au Floridita, qui en fera plus tard le daiquiri frappé, et notamment le Daiquiri n°3 dit « Papa Hemingway »."},
 {cat:"Histoire du bar", q:"Le Mojito, le Daiquiri et le Cuba Libre partagent :", o:["Une origine cubaine","Un même créateur","Une origine portoricaine","Une base de rhum vieux"], r:0, e:"Le Cuba Libre naît vers 1900 avec l'arrivée du Coca-Cola à Cuba pendant la présence américaine ; le Mojito descend du Draque, mélange de tafia, citron vert, menthe et sucre attribué au XVIe siècle."},
 {cat:"Histoire du bar", q:"Le Negroni Sbagliato a été créé :", o:["Au Bar Basso de Milan","Au Caffè Camparino","Au Caffè Casoni de Florence","Au Harry's Bar de Venise"], r:0, e:"« Sbagliato » veut dire raté : Mirko Stocchetto aurait saisi une bouteille de spumante à la place du gin. Bar Basso, Milan, années 1970."},
 {cat:"Histoire du bar", q:"Le Bellini a été créé par :", o:["Giuseppe Cipriani, au Harry's Bar de Venise","Arrigo Cipriani","Mirko Stocchetto","Gaspare Campari"], r:0, e:"Vers 1948, prosecco et purée de pêche blanche. Le nom vient du peintre Giovanni Bellini, dont une rétrospective avait lieu à Venise. Le Harry's Bar a ouvert en 1931."},
 {cat:"Histoire du bar", q:"Le terme « speakeasy » désigne :", o:["Un bar clandestin de la Prohibition","Un bar à cocktails de luxe","Un bar d'hôtel","Le comptoir d'un saloon"], r:0, e:"De « speak easy », parler doucement pour ne pas attirer l'attention. Le néo-speakeasy, esthétique reprise à partir de Milk & Honey (1999), en est la relecture moderne."},
 {cat:"Histoire du bar", q:"Harry Craddock, avant d'arriver au Savoy, avait travaillé :", o:["Aux États-Unis, qu'il quitte à cause de la Prohibition","En Écosse","À La Havane","En Australie"], r:0, e:"Il aurait servi le dernier cocktail légal avant l'entrée en vigueur du Volstead Act. Le Savoy Cocktail Book paraît en 1930, illustré dans le style art déco."},
 {cat:"Histoire du bar", q:"Le Hanky Panky d'Ada Coleman doit son nom :", o:["À la réaction de l'acteur Charles Hawtrey en le goûtant","Au quartier de Soho","À une chanson de music-hall","Au nom d'un cheval de course"], r:0, e:"Il aurait dit « by Jove, that is the real hanky panky ». Gin, vermouth rouge et deux traits de Fernet-Branca. Coleman a tenu l'American Bar de 1903 à 1926."},
 {cat:"Histoire du bar", q:"Le Bloody Mary est attribué à :", o:["Fernand Petiot","Harry Craddock","Harry McElhone","Frank Meier"], r:0, e:"Au New York Bar de Paris (futur Harry's) au début des années 1920, sous les ordres de MacElhone, puis développé au King Cole Bar du St. Regis à New York, où il fut rebaptisé Red Snapper. Attribution DISPUTÉE : l'acteur George Jessel revendiquait la paternité du simple vodka-tomate ; Petiot soutenait avoir ajouté les épices et les sauces qui en font un vrai Bloody Mary."},
 {cat:"Histoire du bar", q:"Le French 75 tire son nom :", o:["D'un canon de campagne de 75 mm","D'une adresse parisienne","D'un régiment britannique","De 75 ingrédients"], r:0, e:"Le canon français de 75 mm de la Première Guerre mondiale, réputé pour sa cadence de tir. Gin, citron, sucre, champagne. Vermeire donne un « Soixante-Quinze » au calvados et au gin."},
 {cat:"Histoire du bar", q:"Le Mint Julep est traditionnellement associé :", o:["Au Kentucky Derby","Au Mardi Gras","Au Thanksgiving","Au Memorial Day"], r:0, e:"Boisson officielle du Derby depuis 1938. Servi dans une timbale en argent ou en étain, sur glace pilée, jusqu'au givrage du métal."},
 {cat:"Histoire du bar", q:"Le Singapore Sling est né :", o:["Au Raffles Hotel de Singapour","Au Peninsula de Hong Kong","Au Mandarin de Bangkok","Au Taj de Bombay"], r:0, e:"Vers 1915, attribué au barman Ngiam Tong Boon. Gin, Bénédictine, cherry brandy, ananas. C'est l'un des rares classiques historiques à la Bénédictine, comme le Vieux Carré et le Frisco."},
 {cat:"Histoire du bar", q:"Le Vieux Carré a été créé :", o:["À l'Hôtel Monteleone de La Nouvelle-Orléans","Au Napoleon House","Chez Antoine's","Au Roosevelt Hotel"], r:0, e:"En 1938, par Walter Bergeron, chef barman de l'hôtel. Attention au piège : le Carousel Bar, le comptoir tournant qu'on associe au drink, n'ouvre qu'en 1949. Nuance de datation : la recette paraît dès 1937 dans « Famous New Orleans Drinks and How to Mix 'Em » de Stanley Clisby Arthur. Rye (les Américains), cognac et Bénédictine (les Français), vermouth rouge (les Italiens), Peychaud's et angostura (les Créoles) : chaque ingrédient représente une communauté du quartier."},
 {cat:"Histoire du bar", q:"Le Ramos Gin Fizz exige traditionnellement :", o:["Un shake de douze minutes","Un dry shake seul","Un passage au blender","Une infusion de vingt-quatre heures"], r:0, e:"Henry C. Ramos, La Nouvelle-Orléans, 1888. Gin, crème, blanc d'œuf, citron, citron vert, sucre, fleur d'oranger, soda. Il employait une brigade de « shaker boys » qui se passaient le shaker."},
 {cat:"Histoire du bar", q:"Le Last Word est un cocktail à parts égales né :", o:["Au Detroit Athletic Club","Au Pegu Club de Rangoon","Au Savoy","Au Harry's Bar"], r:0, e:"Il figure à la carte du club dès 1916 — c'est la plus ancienne trace. Son créateur reste INCONNU : le vaudevilliste Frank Fogarty l'a popularisé mais rien ne prouve qu'il l'ait inventé. Gin, Chartreuse verte, marasquin, citron vert à parts égales. Oublié pendant un demi-siècle, il ne survit que par une mention dans « Bottoms Up! » de Ted Saucier (1951), où Murray Stenson le retrouve pour le remettre à la carte du Zig Zag Café de Seattle en 2003-2004."},
 {cat:"Histoire du bar", q:"La Chartreuse est produite par :", o:["Les moines chartreux","Les bénédictins de Fécamp","Les trappistes","Les jésuites de Grenoble"], r:0, e:"Recette de l'« élixir de longue vie » remise aux Chartreux en 1605. La Chartreuse verte titre 55°, la jaune 40°. Seuls deux moines connaissent la recette — un parallèle direct avec la Bénédictine et ses 27 plantes."},
 {cat:"Histoire du bar", q:"L'angostura bitter a été mis au point :", o:["Par un médecin allemand au Venezuela","Par un pharmacien de Trinidad","Par un botaniste anglais en Guyane","Par un moine espagnol"], r:0, e:"Johann Siegert, chirurgien de l'armée de Bolívar, à Angostura (aujourd'hui Ciudad Bolívar) en 1824, comme tonique digestif. La production est transférée à Trinidad en 1875. Sa grande étiquette dépasse de la bouteille par erreur jamais corrigée."},
 {cat:"Histoire du bar", q:"Le Gimlet est lié historiquement :", o:["À la Royal Navy et au scorbut","À la marine marchande portugaise","Aux planteurs de Ceylan","À la Compagnie des Indes"], r:0, e:"Le Merchant Shipping Act de 1867 impose le jus d'agrumes à bord ; le Rose's Lime Juice, conservé sans alcool, s'impose. Le nom viendrait du chirurgien Gimlette ou de la vrille (gimlet) à percer les fûts."},
